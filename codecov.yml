# Codecov's view of coverage. Complementary to, not a substitute for, the local gate:
# `agentup verify coverage` enforces the same patch threshold on a developer machine and
# inside the verification module, which Codecov cannot do.
coverage:
  status:
    patch:
      default:
        target: 90%
        threshold: 0%
        # Do not pass a pull request just because Codecov could not find a base report.
        if_not_found: failure
    project:
      default:
        # Total coverage barely moves per change on a codebase this size, so the project
        # status only guards against a sharp drop. Patch coverage is the real gate.
        target: auto
        threshold: 1%
        if_not_found: success

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true

# Must contain every "coverage.exclude" glob in agent-up.json, or Codecov fails a change
# the local gate passes. AgentUp.Architecture.Tests enforces that rather than trusting a
# comment; extra entries here are fine, because agent-up.json scopes itself with
# "coverage.include" instead.
ignore:
  - "**/Composition/**"
  - "**/Program.cs"
  - "**/App.axaml.cs"
  - "**/Properties/**"
  - "**/Resources/**"
  - "AgentUp.Tray/Features/AutoStart/WindowsAutoStartRegistrar.cs"
  - "AgentUp.Tray/Features/AutoStart/LaunchctlProcess.cs"
  - "**/*.Tests/**"
