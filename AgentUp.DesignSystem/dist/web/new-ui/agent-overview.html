<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent · Overview — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 1440px; min-height: 900px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="au-screen">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-minimize">−</span>
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-restore">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon" data-au-action="window-close">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav" data-au-action="nav-team" data-au-selection="nav:0:aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" data-au-action="add-workspace" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces" data-au-repeat="workspace" data-au-action="open-workspace"><div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Bob</strong>
          <small class="au-workspace-branch">feat/45-deliver</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Frank</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--danger"></span>
        <span>
          <strong class="au-workspace-name">Hector</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--warning"></span>
        <span>
          <strong class="au-workspace-name">Lucy</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Mia</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div></div>
        </div>
        <button type="button" class="aun-nav" data-au-action="nav-tasks" data-au-selection="nav:1:aun-nav--current">Tasks</button>
        <button type="button" class="aun-nav" data-au-action="nav-settings" data-au-selection="nav:2:aun-nav--current">Settings</button>
      </aside>
        <main class="au-screen-main">
          <div class="au-screen-tabs"><div class="au-cluster">
        <button class="au-app-tab au-app-tab--selected" type="button" data-au-action="tab-overview" data-au-selection="selected:0:au-app-tab--selected">Overview</button>
        <button class="au-app-tab" type="button" data-au-action="tab-chat" data-au-selection="selected:1:au-app-tab--selected">Chat</button>
        <button class="au-app-tab" type="button" data-au-action="tab-git" data-au-selection="selected:2:au-app-tab--selected">Git</button>
        <span class="au-tab-sep"></span>
        <button class="au-app-tab" type="button" data-au-action="tab-application" data-au-selection="selected:3:au-app-tab--selected"><span class="au-status-dot au-status-dot--healthy"></span> Storefront</button>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Orders API</button>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Inventory</button>
      </div></div>
          
          
          <div class="au-screen-pane"><div data-au-demo="overview" data-au-slot="overview">
    <div class="au-overview">
      <div><h1 class="au-page-title">Bob</h1><p class="au-muted">feat/45-deliver</p></div>
      <div class="au-overview-grid">
        <div class="au-card"><span class="au-field-label">State</span><strong class="au-accent">Running</strong></div>
        <div class="au-card"><span class="au-field-label">CPU</span><strong>4.2%</strong></div>
        <div class="au-card"><span class="au-field-label">Memory</span><strong>256 MB</strong></div>
        <div class="au-card"><span class="au-field-label">Storage</span><strong>50 MB</strong></div>
        <div class="au-card"><span class="au-field-label">Processes</span><strong>3</strong></div>
        <div class="au-card"><span class="au-field-label">Applications</span><strong>3</strong></div>
      </div>
      <div class="au-stack">
        <div><span class="au-field-label">Repository</span><p class="au-mono">/demo/harbor</p></div>
        <div><span class="au-field-label">Worktree</span><p class="au-mono">/demo/agents/bob</p></div>
        <div><span class="au-field-label">Commit</span><p class="au-mono">a1b2c3d</p></div>
      </div>
    </div></div></div>
        </main>
        
      </div>
    </div>
</div>
</body>
</html>
