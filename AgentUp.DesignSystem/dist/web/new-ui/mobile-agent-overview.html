<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent · Overview — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 390px; height: 844px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="aun-phone">
      <header class="aun-phone__head"><div class="aun-agent-head">
        <button type="button" class="aun-agent-back" data-au-action="back" aria-label="Back to the team">‹</button>
        <div class="aun-phone__head-copy" data-au-demo="member"><h1 class="au-page-title">Bob</h1><span class="aun-phone__subtitle">feat/45-deliver</span></div>
        <button type="button" class="aun-agent-reload" data-au-action="reload">Reload</button>
      </div></header>
      <nav class="au-tabs" aria-label="Agent sections"><button class="au-tab au-tab--selected" type="button" aria-selected="true" data-au-action="tab-apps" data-au-selection="selected:0:au-tab--selected">Apps</button><button class="au-tab" type="button" data-au-action="tab-git" data-au-selection="selected:1:au-tab--selected">Git</button><button class="au-tab" type="button" data-au-action="tab-chat" data-au-selection="selected:2:au-tab--selected">Chat</button></nav>
      <div class="aun-phone__body"><div data-au-slot="overview">
        <div class="au-app-list">
        <div class="au-workspace">
          <button class="au-lifecycle-button" type="button">■</button>
          <button class="au-lifecycle-button" type="button"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg></button>
          <span class="au-status-dot au-status-dot--healthy"></span>
          <span>
            <strong class="au-workspace-name">Harbor Shop</strong>
            <small class="au-workspace-branch">Healthy</small>
          </span>
        </div>
        <span class="au-field-label">Applications</span>
        <div class="au-workspace">
          <span class="au-status-dot au-status-dot--healthy"></span>
          <span>
            <strong class="au-workspace-name">Storefront</strong>
            <small class="au-workspace-branch">Running</small>
          </span>
        </div>
        <div class="au-workspace">
          <span class="au-status-dot au-status-dot--healthy"></span>
          <span>
            <strong class="au-workspace-name">Orders API</strong>
            <small class="au-workspace-branch">Running</small>
          </span>
        </div>
        <div class="au-workspace">
          <span class="au-status-dot au-status-dot--healthy"></span>
          <span>
            <strong class="au-workspace-name">Inventory</strong>
            <small class="au-workspace-branch">Running</small>
          </span>
        </div>
      </div>
      </div></div>
      <div class="au-mobile-tab-bar" role="tablist">
        <button class="au-subtab au-nav-tab au-subtab--selected" type="button" data-au-action="nav-team" data-au-selection="selected:0:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.2a3.8 3.8 0 0 0-3.8-3.8H6.8A3.8 3.8 0 0 0 3 17.8V19"></path><circle cx="9" cy="7.2" r="3.2"></circle><path d="M21 19v-1.2a3.8 3.8 0 0 0-2.9-3.7"></path><path d="M16.2 4.2a3.2 3.2 0 0 1 0 6"></path></svg>
          Team
        </button>
        <button class="au-subtab au-nav-tab" type="button" data-au-action="nav-tasks" data-au-selection="selected:1:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="m3.5 5.8 1.3 1.3L7.4 4.5"></path><path d="m3.5 11.8 1.3 1.3L7.4 10.5"></path><path d="M4 18h1.5"></path></svg>
          Tasks
        </button>
        <button class="au-subtab au-nav-tab" type="button" data-au-action="nav-settings" data-au-selection="selected:2:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </div>
</div>
</body>
</html>
