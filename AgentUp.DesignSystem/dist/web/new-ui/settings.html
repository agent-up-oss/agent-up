<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 1440px; min-height: 900px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="au-screen">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-minimize">−</span>
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-restore">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon" data-au-action="window-close">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav" data-au-action="nav-team" data-au-selection="nav:0:aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" data-au-action="add-workspace" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces" data-au-repeat="workspace" data-au-action="open-workspace"><div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Bob</strong>
          <small class="au-workspace-branch">feat/45-deliver</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Frank</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--danger"></span>
        <span>
          <strong class="au-workspace-name">Hector</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--warning"></span>
        <span>
          <strong class="au-workspace-name">Lucy</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Mia</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div></div>
        </div>
        <button type="button" class="aun-nav" data-au-action="nav-tasks" data-au-selection="nav:1:aun-nav--current">Tasks</button>
        <button type="button" class="aun-nav aun-nav--current" data-au-action="nav-settings" data-au-selection="nav:2:aun-nav--current">Settings</button>
      </aside>
        <main class="au-screen-main">
          
          
          
          <div class="au-screen-pane"><div class="aun-settings">
        <div class="aun-group">
          <p class="au-field-label">Interface</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Classic interface</span><span class="aun-settings__state">The previous workspace shell</span></span>
              <button class="aun-btn" type="button" data-au-action="use-classic">Use classic</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Forge connection</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Task source</span>
              <button class="aun-btn aun-btn--primary" type="button" data-au-action="connect-source">Connect</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Capabilities</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">.NET</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Docker</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Codex</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Cursor</span><span class="aun-settings__state">Disabled</span></span>
              <button class="aun-btn aun-btn--primary" type="button">Enable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Claude</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Login</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Demo</span>
              <button class="aun-btn" type="button" data-au-action="logout">Logout</button>
            </div>
          </div>
        </div>
      </div></div>
        </main>
        
      </div>
    </div>
</div>
</body>
</html>
