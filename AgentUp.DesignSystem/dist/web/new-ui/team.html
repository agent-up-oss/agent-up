<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 1440px; min-height: 900px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="aun"><nav class="aun-rail" aria-label="Command center">
        <p class="aun-rail__section">TEAM</p>
        <p class="aun-faint">This server has no workspaces yet.</p>
        <span class="aun-rail__spacer"></span>
        <button type="button" class="aun-rail__switch">Switch back to the classic interface</button>
      </nav></div>
</div>
</body>
</html>
