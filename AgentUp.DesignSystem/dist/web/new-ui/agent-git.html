<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent · Git — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 1440px; min-height: 900px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="au-screen">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon">−</span>
          <span class="au-chrome-button au-chrome-icon">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces"><div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Bob</strong>
          <small class="au-workspace-branch">feat/45-deliver</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Frank</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--danger"></span>
        <span>
          <strong class="au-workspace-name">Hector</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--warning"></span>
        <span>
          <strong class="au-workspace-name">Lucy</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Mia</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div></div>
        </div>
        <button type="button" class="aun-nav">Tasks</button>
        <button type="button" class="aun-nav">Settings</button>
      </aside>
        <main class="au-screen-main">
          <div class="au-screen-tabs"><div class="au-cluster">
        <button class="au-app-tab">Overview</button>
        <button class="au-app-tab">Chat</button>
        <button class="au-app-tab au-app-tab--selected">Git</button>
        <span class="au-tab-sep"></span>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Storefront</button>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Orders API</button>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Inventory</button>
      </div></div>
          
          
          <div class="au-screen-pane"><div class="au-git-toolbar">
        <div class="au-git-branch-row">
          <button class="au-button au-button--secondary au-button--compact au-git-branch" type="button">main <span class="au-muted">▾</span></button>
          <button class="au-browser-button" type="button"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"></path></svg></button>
          <button class="au-browser-button" type="button"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6"></path></svg></button>
        </div>
        <div class="au-git-actions">
          <button class="au-browser-button" type="button">↻</button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Fetch</button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Pull</button>
          <button class="au-button au-button--compact" type="button">Push</button>
          <button class="au-button au-button--danger au-button--compact" type="button">Discard</button>
          <button class="au-button au-button--secondary au-button--compact au-git-history" type="button">History</button>
        </div>
      </div><div class="au-git-heading">
        <p class="au-accent">Git changes</p>
        <p class="au-muted">2 of 4 file(s) selected</p>
      </div><div class="au-git-change-list">
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">Changes</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">apps</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">storefront</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">ProductGrid.tsx</span>
          <span class="au-git-status au-git-status--modified">M</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox au-checkbox--checked"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">PromoBanner.tsx</span>
          <span class="au-git-status au-git-status--added">+</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox au-checkbox--checked"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">PromoBanner2.tsx</span>
          <span class="au-git-status au-git-status--added">+</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">api</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">orders.ts</span>
          <span class="au-git-status au-git-status--modified">M</span>
        </div>
      </div><div class="au-git-commit">
        <textarea class="au-input" readonly autofocus>feat(storefront): add the weekly promo banner</textarea>
        <button class="au-button" type="button">Commit</button>
      </div></div>
        </main>
        
      </div>
    </div>
</div>
</body>
</html>
