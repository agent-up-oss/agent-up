<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent · Files — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 1440px; min-height: 900px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="au-screen">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon" data-au-action="refresh"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-minimize">−</span>
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-restore">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon" data-au-action="window-close">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-rail__nav">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav" data-au-action="nav-team" data-au-selection="nav:0:aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" data-au-action="add-workspace" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces" data-au-repeat="workspace" data-au-action="open-workspace"><div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Bob</strong>
          <small class="au-workspace-branch">feat/45-deliver</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Frank</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--danger"></span>
        <span>
          <strong class="au-workspace-name">Hector</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--warning"></span>
        <span>
          <strong class="au-workspace-name">Lucy</strong>
          <small class="au-workspace-branch">feat/44-restock</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
<div class="au-workspace">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--idle"></span>
        <span>
          <strong class="au-workspace-name">Mia</strong>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div></div>
        </div>
        <button type="button" class="aun-nav" data-au-action="nav-tasks" data-au-selection="nav:1:aun-nav--current">Tasks</button>
        <button type="button" class="aun-nav" data-au-action="nav-settings" data-au-selection="nav:2:aun-nav--current">Settings</button>
        </div>
        <div class="aun-session">
        <span class="aun-session__id"><span class="au-field-label">Server</span><span class="aun-session__name">Demo</span></span>
        <button class="au-session-logout aun-session__logout" type="button" data-au-action="logout" aria-label="Log out of this server">Logout</button>
      </div>
      </aside>
        <main class="au-screen-main">
          <div class="au-screen-tabs"><div class="au-cluster">
        <button class="au-app-tab" type="button" data-au-action="tab-overview" data-au-selection="selected:0:au-app-tab--selected">Overview</button>
        <button class="au-app-tab" type="button" data-au-action="tab-chat" data-au-selection="selected:1:au-app-tab--selected">Chat</button>
        <button class="au-app-tab" type="button" data-au-action="tab-git" data-au-selection="selected:2:au-app-tab--selected">Git</button>
        <button class="au-app-tab au-app-tab--selected" type="button" data-au-action="tab-files" data-au-selection="selected:3:au-app-tab--selected">Files</button>
        <span class="au-tab-sep"></span>
        <span class="au-cluster" data-au-slot="applications" data-au-repeat="application-tab">
          <button class="au-app-tab" type="button"><span class="au-status-dot au-status-dot--healthy"></span> Storefront</button>
          <button class="au-app-tab" type="button"><span class="au-status-dot au-status-dot--healthy"></span> Orders API</button>
          <button class="au-app-tab" type="button"><span class="au-status-dot au-status-dot--healthy"></span> Inventory</button>
        </span>
      </div></div>
          
          
          <div class="au-screen-pane"><div data-au-slot="files">
        <div class="au-files-toolbar">
        <span class="au-field-label">Files</span>
        <span class="au-files-root">harbor-shop · main</span>
        <button class="au-browser-button" type="button"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></button>
      </div>
        <div class="au-git-change-list">
        <div class="au-git-row">
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">apps</span>
          <span class="au-files-count">3</span>
        </div>
        <div class="au-git-row">
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--collapsed" type="button">▸</button>
          <span class="au-git-change-name au-git-change-name--directory">api</span>
          <span class="au-files-count">1</span>
        </div>
        <div class="au-git-row">
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">storefront</span>
          <span class="au-files-count">2</span>
        </div>
        <div class="au-git-row">
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">package.json</span>
          <span class="au-files-size">612 B</span>
          <span class="au-git-status"></span>
        </div>
        <div class="au-git-row au-git-row--selected">
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">ProductGrid.tsx</span>
          <span class="au-files-size">1.8 KB</span>
          <span class="au-git-status au-git-status--modified">M</span>
        </div>
        <div class="au-git-row">
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">PromoBanner.tsx</span>
          <span class="au-files-size">214 B</span>
          <span class="au-git-status au-git-status--added">+</span>
        </div>
        <div class="au-git-row">
          <button class="au-git-tree-toggle au-git-tree-toggle--collapsed" type="button">▸</button>
          <span class="au-git-change-name au-git-change-name--directory">docs</span>
        </div>
        <div class="au-git-row">
          <span class="au-git-change-name">agent-up.json</span>
          <span class="au-files-size">1.1 KB</span>
          <span class="au-git-status"></span>
        </div>
        <div class="au-git-row">
          <span class="au-git-change-name">README.md</span>
          <span class="au-files-size">940 B</span>
          <span class="au-git-status"></span>
        </div>
      </div>
      </div></div>
        </main>
        
      </div>
    </div>
</div>
</body>
</html>
