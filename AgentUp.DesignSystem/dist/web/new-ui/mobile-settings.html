<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 390px; height: 844px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="aun-phone">
      <header class="aun-phone__head"><div class="aun-phone__head-row">
        <div class="aun-phone__head-copy"><h1 class="au-page-title">Settings</h1></div>
      </div></header>
      <div class="aun-phone__body"><div class="aun-settings">
        <div class="aun-group">
          <p class="au-field-label">Interface</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Classic interface</span><span class="aun-settings__state">The previous workspace shell</span></span>
              <button class="aun-btn" type="button" data-au-action="use-classic">Use classic</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Forge connection</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Task source</span>
              <button class="aun-btn aun-btn--primary" type="button" data-au-action="connect-source">Connect</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Capabilities</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">.NET</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Docker</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Codex</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Cursor</span><span class="aun-settings__state">Disabled</span></span>
              <button class="aun-btn aun-btn--primary" type="button">Enable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Claude</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
          </div>
        </div>
        <div class="aun-group" data-au-when="chatSettings">
          <p class="au-field-label">Chat</p>
          <div class="au-cluster" data-au-slot="settingsWorkspaces" data-au-repeat="settings-workspace">
            <button class="au-app-tab au-app-tab--selected" type="button">Bob</button>
            <button class="au-app-tab" type="button">Frank</button>
          </div>
          <div class="aun-settings__list" data-au-slot="chatFields" data-au-repeat="settings-field">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Autonomy enabled</span><span class="aun-settings__state">Enable autonomy for this Server</span></span>
              <button class="aun-btn" type="button">Enable</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <p class="au-field-label">Login</p>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Demo</span>
              <button class="aun-btn" type="button" data-au-action="logout">Logout</button>
            </div>
          </div>
        </div>
      </div></div>
      
      <div class="au-mobile-tab-bar" role="tablist">
        <button class="au-subtab au-nav-tab" type="button" data-au-action="nav-team" data-au-selection="selected:0:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.2a3.8 3.8 0 0 0-3.8-3.8H6.8A3.8 3.8 0 0 0 3 17.8V19"></path><circle cx="9" cy="7.2" r="3.2"></circle><path d="M21 19v-1.2a3.8 3.8 0 0 0-2.9-3.7"></path><path d="M16.2 4.2a3.2 3.2 0 0 1 0 6"></path></svg>
          Team
        </button>
        <button class="au-subtab au-nav-tab" type="button" data-au-action="nav-tasks" data-au-selection="selected:1:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="m3.5 5.8 1.3 1.3L7.4 4.5"></path><path d="m3.5 11.8 1.3 1.3L7.4 10.5"></path><path d="M4 18h1.5"></path></svg>
          Tasks
        </button>
        <button class="au-subtab au-nav-tab au-subtab--selected" type="button" data-au-action="nav-settings" data-au-selection="selected:2:au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </div>
</div>
</body>
</html>
