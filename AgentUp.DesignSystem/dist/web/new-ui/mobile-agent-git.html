<!DOCTYPE html>

    <nav class="aun-tabbar" aria-label="Sections"><a class="aun-tabbar__item" href="#bridge"><span class="aun-tabbar__icon">&#9632;</span>Bridge</a><a class="aun-tabbar__item" href="#train"><span class="aun-tabbar__icon">&#9651;</span>Train</a><a class="aun-tabbar__item" href="#tasks"><span class="aun-tabbar__icon">&#9644;</span>Tasks</a><a class="aun-tabbar__item" href="#team" aria-current="page"><span class="aun-tabbar__icon">&#9679;</span>Team</a></nav>
