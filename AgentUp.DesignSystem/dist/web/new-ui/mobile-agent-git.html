<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent · Git — Agent-Up new UI</title>
  <link rel="stylesheet" href="../new-ui.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--au-color-canvas); }
    .aun-frame { width: 390px; height: 844px; overflow: hidden; display: flex; }
    .aun-frame > * { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
<div class="aun-frame">
<div class="aun-phone">
      <header class="aun-phone__head"><div class="aun-agent-head">
        <button type="button" class="aun-agent-back" aria-label="Back to the team">‹</button>
        <div class="aun-phone__head-copy" data-au-demo="member"><h1 class="au-page-title">Bob</h1><span class="aun-phone__subtitle">feat/45-deliver</span></div>
        <button type="button" class="aun-agent-reload">Reload</button>
      </div></header>
      <nav class="au-tabs" aria-label="Agent sections"><button class="au-tab" type="button">Apps</button><button class="au-tab au-tab--selected" type="button" aria-selected="true">Git</button><button class="au-tab" type="button">Chat</button></nav>
      <div class="aun-phone__body"><div class="au-git-toolbar">
        <div class="au-git-branch-row">
          <button class="au-button au-button--secondary au-git-branch" type="button">main <span class="au-muted">▾</span></button>
          <button class="au-lifecycle-button" type="button">+</button>
        </div>
        <div class="au-git-actions">
          <button class="au-browser-button" type="button">↻</button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Fetch</button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Pull</button>
          <button class="au-button au-button--compact" type="button">Push</button>
          <button class="au-button au-button--danger au-button--compact" type="button">Discard</button>
          <button class="au-button au-button--secondary au-button--compact au-git-history" type="button">History</button>
        </div>
        <span class="au-field-label">Changes</span>
      </div><div class="au-git-change-list">
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">Changes</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">apps</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">storefront</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">ProductGrid.tsx</span>
          <span class="au-git-status au-git-status--modified">M</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox au-checkbox--checked"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">PromoBanner.tsx</span>
          <span class="au-git-status au-git-status--added">+</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox au-checkbox--checked"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">PromoBanner2.tsx</span>
          <span class="au-git-status au-git-status--added">+</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <button class="au-git-tree-toggle au-git-tree-toggle--expanded" type="button">▾</button>
          <span class="au-git-change-name au-git-change-name--directory">api</span>
        </div>
        <div class="au-git-row">
          <span class="au-checkbox"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-tree-guide"></span>
          <span class="au-git-change-name">orders.ts</span>
          <span class="au-git-status au-git-status--modified">M</span>
        </div>
      </div><div class="au-git-commit au-git-commit--mobile">
        <span class="au-field-label">Commit message</span>
        <textarea class="au-input" readonly>feat(storefront): add the weekly promo banner</textarea>
        <button class="au-button" type="button">Commit <span class="au-git-insertions au-git-insertions--on-primary">+2</span></button>
      </div></div>
      <div class="au-mobile-tab-bar" role="tablist">
        <button class="au-subtab au-nav-tab au-subtab--selected" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.2a3.8 3.8 0 0 0-3.8-3.8H6.8A3.8 3.8 0 0 0 3 17.8V19"></path><circle cx="9" cy="7.2" r="3.2"></circle><path d="M21 19v-1.2a3.8 3.8 0 0 0-2.9-3.7"></path><path d="M16.2 4.2a3.2 3.2 0 0 1 0 6"></path></svg>
          Team
        </button>
        <button class="au-subtab au-nav-tab" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="m3.5 5.8 1.3 1.3L7.4 4.5"></path><path d="m3.5 11.8 1.3 1.3L7.4 10.5"></path><path d="M4 18h1.5"></path></svg>
          Tasks
        </button>
        <button class="au-subtab au-nav-tab" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </div>
</div>
</body>
</html>
