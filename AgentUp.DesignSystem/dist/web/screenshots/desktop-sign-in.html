<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, height=900, initial-scale=1" />
  <title>Desktop sign-in</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:1440px;height:900px">
      <div class="au-chrome">
        <span></span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon">−</span>
          <span class="au-chrome-button au-chrome-icon">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon">×</span>
        </span>
      </div>
      <div class="au-screen-center"><form class="au-sign-in au-stack">
        <p class="au-eyebrow">Agent-Up Server</p>
        <h2 class="au-page-title">Agent-Up Server</h2>
        <p class="au-muted">Choose a saved server or enter a URL. Switching replaces this window's local workspace and browser state.</p>
        <span class="au-field-label">Server URL</span>
        <input class="au-input" value="http://127.0.0.1:9" readonly autofocus />
        <span class="au-field-label">Saved servers</span>
        <div class="au-sign-in-list">
          <button class="au-choice au-choice--compact" type="button" title="http://127.0.0.1:9"><span class="au-choice-label">Demo</span></button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Remove</button>
        </div>
        <button class="au-button" type="button">Connect</button>
      </form></div>
    </div>
</body>
</html>
