<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, height=844, initial-scale=1" />
  <title>Mobile sign-in</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:390px;height:844px">
      
      <div class="au-screen-mobile-body"><form class="au-sign-in au-stack">
        <p class="au-eyebrow">Agent-Up Server</p>
        <h2 class="au-page-title">Connect to server</h2>
        <p class="au-muted">Choose a saved server or enter a URL. Switching replaces this client's local workspace and browser state.</p>
        <span class="au-field-label">Server URL</span>
        <input class="au-input" value="http://127.0.0.1:9" readonly />
        <button class="au-button" type="button">Try and save</button>
        <span class="au-field-label">Saved servers</span>
        <div class="au-sign-in-list">
          <button class="au-choice au-choice--compact" type="button" title="http://127.0.0.1:9"><span class="au-choice-label">Demo</span></button>
          <button class="au-button au-button--secondary au-button--compact" type="button">Remove</button>
          <button class="au-button au-button--secondary" type="button">Add server</button>
        </div>
      </form></div>
    </div>
</body>
</html>
