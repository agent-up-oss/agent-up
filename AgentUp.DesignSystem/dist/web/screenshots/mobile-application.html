<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, height=844, initial-scale=1" />
  <title>Mobile application space</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:390px;height:844px">
      <div class="au-mobile-bar">
        <span class="au-title-tool au-chrome-icon">‹</span>
        <strong>Storefront</strong>
      </div>
      <div class="au-screen-mobile-body"><div class="au-storefront">
        <p class="au-field-label">Storefront</p>
        <h1 class="au-page-title">Harbor Shop</h1>
        <p class="au-muted">Featured goods from the harbor catalog.</p>
        <div class="au-storefront-grid">
          <div class="au-card">
            <strong>Harbor Mug</strong>
            <p class="au-muted">Stoneware, fog glaze</p>
            <p class="au-accent">$18</p>
            <button class="au-button au-button--compact" type="button">Add to cart</button>
          </div>
          <div class="au-card">
            <strong>Canvas Tote</strong>
            <p class="au-muted">Waxed canvas, brass snap</p>
            <p class="au-accent">$32</p>
            <button class="au-button au-button--compact" type="button">Add to cart</button>
          </div>
          <div class="au-card">
            <strong>Chart Lamp</strong>
            <p class="au-muted">Brass shade, linen cord</p>
            <p class="au-accent">$54</p>
            <button class="au-button au-button--compact" type="button">Add to cart</button>
          </div>
        </div>
        <div class="au-card">
          <strong>Cart</strong>
          <div class="au-cart-row"><span>Harbor Mug × 1</span><span>$18</span></div>
          <div class="au-cart-row"><span>Canvas Tote × 1</span><span>$32</span></div>
          <div class="au-cart-row"><strong>Total</strong><strong class="au-accent">$50</strong></div>
          <button class="au-button au-button--compact" type="button">Place order</button>
        </div>
        <h2 class="au-heading">Recent orders</h2>
        <div class="au-card">
          <div class="au-cart-row"><span>Harbor Mug × 1</span><span class="au-accent">$18</span></div>
        </div>
      </div></div>
    </div>
</body>
</html>
