<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, height=900, initial-scale=1" />
  <title>Desktop workspaces</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:1440px;height:900px">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon">−</span>
          <span class="au-chrome-button au-chrome-icon">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail">
          <div class="au-workspace-head">
        <span class="au-muted">Workspaces</span>
        <button class="au-workspace-add" type="button">+</button>
        <button class="au-workspace-add" type="button">‹</button>
      </div>
          <div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Harbor Shop</strong>
          <small class="au-workspace-branch">main</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
        </aside>
        <main class="au-screen-main">
          <div class="au-screen-tabs"><div class="au-cluster">
        <button class="au-app-tab au-app-tab--selected">Overview</button>
        <button class="au-app-tab">Agent</button>
        <button class="au-app-tab">Git</button>
        <span class="au-tab-sep"></span>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Storefront</button>
        <button class="au-app-tab"><span class="au-status-dot au-status-dot--healthy"></span> Orders API</button>
      </div></div>
          
          
          <div class="au-screen-pane"><div class="au-overview">
        <div>
          <h1 class="au-page-title">Workspace overview</h1>
          <p class="au-muted">Harbor Shop</p>
        </div>
        <div class="au-overview-grid">
          <div class="au-card"><span class="au-field-label">State</span><strong class="au-accent">Running</strong></div>
          <div class="au-card"><span class="au-field-label">CPU</span><strong>4.2%</strong></div>
          <div class="au-card"><span class="au-field-label">Memory</span><strong>256 MB</strong></div>
          <div class="au-card"><span class="au-field-label">Storage</span><strong>50 MB</strong></div>
          <div class="au-card"><span class="au-field-label">Processes</span><strong>2</strong></div>
          <div class="au-card"><span class="au-field-label">Applications</span><strong>2</strong></div>
        </div>
        <div class="au-stack">
          <div><span class="au-field-label">Repository</span><p class="au-mono">/demo/harbor-shop</p></div>
          <div><span class="au-field-label">Worktree</span><p class="au-mono">/demo/harbor-shop</p></div>
          <div><span class="au-field-label">Commit</span><p class="au-mono">a1b2c3d</p></div>
        </div>
      </div></div>
        </main>
        
      </div>
      
    </div>
</body>
</html>
