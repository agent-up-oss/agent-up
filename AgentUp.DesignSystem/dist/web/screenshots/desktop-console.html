<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, height=900, initial-scale=1" />
  <title>Desktop console</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:1440px;height:900px">
      <div class="au-chrome">
        <span class="au-cluster">
          <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
          <span class="au-title-tool au-chrome-icon" data-au-action="refresh"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v6h-6"></path></svg></span>
          <span class="au-badge au-badge--healthy"><span class="au-status-dot au-status-dot--healthy"></span>SERVER ONLINE</span>
        </span>
        <span class="au-logo-lockup"><span class="au-chrome-mark"></span><strong class="au-chrome-title">Agent-Up</strong></span>
        <span class="au-cluster">
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-minimize">−</span>
          <span class="au-chrome-button au-chrome-icon" data-au-action="window-restore">□</span>
          <span class="au-chrome-button au-chrome-close au-chrome-icon" data-au-action="window-close">×</span>
        </span>
      </div>
      <div class="au-screen-body">
        <aside class="au-rail au-screen-rail">
          <div class="au-workspace-head">
        <span class="au-muted">Workspaces</span>
        <button class="au-workspace-add" type="button">+</button>
        <button class="au-workspace-add" type="button">‹</button>
      </div>
          <div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Harbor Shop</strong>
          <small class="au-workspace-branch">main</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div>
        </aside>
        <main class="au-screen-main">
          <div class="au-screen-tabs"><div class="au-cluster">
        <button class="au-app-tab" type="button" data-au-action="tab-overview" data-au-selection="selected:0:au-app-tab--selected">Overview</button>
        <button class="au-app-tab" type="button" data-au-action="tab-chat" data-au-selection="selected:1:au-app-tab--selected">Chat</button>
        <button class="au-app-tab" type="button" data-au-action="tab-git" data-au-selection="selected:2:au-app-tab--selected">Git</button>
        <span class="au-tab-sep"></span>
        <button class="au-app-tab au-app-tab--selected" type="button" data-au-action="select-application" data-au-id="Storefront" data-au-selection="app:Storefront:au-app-tab--selected"><span class="au-status-dot au-status-dot--healthy"></span> Storefront</button>
        <button class="au-app-tab" type="button" data-au-action="select-application" data-au-id="Orders API" data-au-selection="app:Orders API:au-app-tab--selected"><span class="au-status-dot au-status-dot--healthy"></span> Orders API</button>
        <button class="au-app-tab" type="button" data-au-action="select-application" data-au-id="Inventory" data-au-selection="app:Inventory:au-app-tab--selected"><span class="au-status-dot au-status-dot--healthy"></span> Inventory</button>
      </div></div>
          <div class="au-screen-subtabs"><div class="au-cluster">
        <button class="au-subtab" type="button" data-au-action="subtab-port" data-au-when="port" data-au-selection="tool:port:au-subtab--selected"><span class="au-status-dot au-status-dot--healthy"></span> 3000:9100</button>
        <button class="au-subtab au-subtab--selected" type="button" data-au-action="subtab-console" data-au-when="console" data-au-selection="tool:console:au-subtab--selected">Console</button>
        <button class="au-subtab" type="button" data-au-action="subtab-diagnostics" data-au-when="diagnostics" data-au-selection="tool:diagnostics:au-subtab--selected">Diagnostics</button>
        <button class="au-subtab" type="button" data-au-action="subtab-metrics" data-au-when="metrics" data-au-selection="tool:metrics:au-subtab--selected">Metrics</button>
        <button class="au-subtab" type="button" data-au-action="subtab-database" data-au-when="database" data-au-selection="tool:database:au-subtab--selected">Database</button>
      </div></div>
          
          <div class="au-screen-pane"><pre class="au-console">[install] npm install
Storefront listening on WEB_PORT</pre></div>
        </main>
        
      </div>
      
    </div>
</body>
</html>
