<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, height=844, initial-scale=1" />
  <title>Mobile workspace list</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:390px;height:844px">
      <div class="au-mobile-bar">
        <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
        <strong>Workspaces</strong>
        <button class="au-button au-button--secondary au-button--compact" type="button">Reload</button>
      </div>
      <div class="au-screen-mobile-body"><div class="au-workspace au-workspace--selected">
        <button class="au-lifecycle-button" type="button">■</button>
        <span class="au-status-dot au-status-dot--healthy"></span>
        <span>
          <strong class="au-workspace-name">Harbor Shop</strong>
          <small class="au-workspace-branch">main</small>
        </span>
        <button class="au-workspace-delete" type="button">×</button>
      </div><button class="au-workspace-add">+</button></div>
    </div>
</body>
</html>
