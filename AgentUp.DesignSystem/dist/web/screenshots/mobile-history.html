<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, height=844, initial-scale=1" />
  <title>Mobile Git history</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:390px;height:844px">
      <div class="au-mobile-bar">
        <span class="au-title-tool au-chrome-icon">‹</span>
        <strong>History</strong>
      </div>
      <div class="au-screen-mobile-body"><div class="au-git-log">
        <div class="au-git-log-detail">
          <span class="au-git-log-subject">feat(storefront): add the weekly promo banner</span>
          <span class="au-git-log-author">Demo</span>
          <div class="au-cluster">
            <span class="au-git-log-ref au-git-log-ref--head">HEAD</span>
          </div>
        </div>
        <div class="au-git-log-track">
          <div>
            <div class="au-git-log-row">
              <span class="au-git-log-time">02.10.26 14:33</span>
            </div>
            <div class="au-git-log-row">
              <span class="au-git-log-time">22.09.26 07:30</span>
            </div>
          </div>
          <div class="au-git-log-graph-scroll">
            <div class="au-git-log-row">
              <svg class="au-git-log-graph" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                <g class="au-git-log-lane-0">
                  <path class="au-git-log-graph-edge" d="M 7 14 L 7 28"></path>
                  <circle class="au-git-log-graph-node au-git-log-graph-node--filled" cx="7" cy="14" r="3.5"></circle>
                </g>
              </svg>
            </div>
            <div class="au-git-log-row">
              <svg class="au-git-log-graph" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                <g class="au-git-log-lane-0">
                  <path class="au-git-log-graph-edge" d="M 7 0 L 7 14"></path>
                  <circle class="au-git-log-graph-node au-git-log-graph-node--filled" cx="7" cy="14" r="3.5"></circle>
                </g>
              </svg>
            </div>
          </div>
        </div>
      </div></div>
    </div>
</body>
</html>
