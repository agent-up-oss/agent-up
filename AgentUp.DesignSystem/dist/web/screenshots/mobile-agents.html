<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, height=844, initial-scale=1" />
  <title>Mobile Agents</title>
  <link rel="stylesheet" href="../screenshots.css" />
</head>
<body class="au-theme">
<div class="au-theme au-screen" style="width:390px;height:844px">
      <div class="au-mobile-bar">
        <span class="au-title-tool au-chrome-icon"><svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
      </div>
      <div class="au-screen-mobile-body"><div class="au-stack au-agent-picker">
        <span class="au-field-label">Workspace sessions</span>
        <p class="au-muted">No saved sessions yet.</p>
        <span class="au-field-label">Start another session</span>
        <button class="au-choice" type="button"><span><strong class="au-workspace-name">Codex</strong><small class="au-workspace-branch">Open existing session</small></span></button>
        <button class="au-choice" type="button"><span><strong class="au-workspace-name">Cursor</strong><small class="au-workspace-branch">Create a new session</small></span></button>
        <button class="au-choice" type="button"><span><strong class="au-workspace-name">Claude</strong><small class="au-workspace-branch">Create a new session</small></span></button>
      </div></div>
      <div class="au-mobile-tab-bar au-cluster" role="tablist">
        <button class="au-subtab au-nav-tab" aria-selected="false">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          Apps
        </button>
        <button class="au-subtab au-nav-tab">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8.2 16.2 16 8"></path><path d="M18 8.6v6.8"></path></svg>
          Git
        </button>
        <button class="au-subtab au-nav-tab au-subtab--selected">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-1.4 1.9"></path><path d="M18 12H7a2 2 0 0 0-2 2v6l3-2h10a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"></path></svg>
          Agents
        </button>
        <button class="au-subtab au-nav-tab">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
      
    </div>
</body>
</html>
