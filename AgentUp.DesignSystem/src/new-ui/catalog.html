<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent-Up new UI components</title>
</head>
<body>
  <!--
    Components for the New UI. Each one is a module the Desktop or Mobile command center already
    draws. Screens name these ids; they do not redraw the module.
  -->
  <section data-au-surface="new-ui" data-au-title="New UI" data-au-intro="Command center modules taken from the Desktop and Mobile views.">

    <article data-au-component="page-title" data-au-title="Page title" data-au-note="The product page headline. Screens and heads pass the words; the type stays this one class." data-au-avalonia="TextBlock" data-au-class="au-page-title">
      <h1 class="au-page-title" data-au-text="title">Tasks</h1>
    </article>

    <article data-au-component="section-label" data-au-title="Section label" data-au-note="The small headline above a group. Settings and Tasks use this same label." data-au-avalonia="TextBlock" data-au-class="au-field-label">
      <p class="au-field-label" data-au-text="label">In progress · 1</p>
    </article>

    <article data-au-component="sidebar" data-au-title="Sidebar" data-au-note="Desktop only. Team, Tasks, and Settings. Workspaces are sub-options under Team, five at most; a longer list keeps Load more. The rail does not collapse. Add stays, on the right of Team. Logout lives on Settings." data-au-avalonia="Border" data-au-class="au-screen-rail" data-au-states="nav=aun-nav/aun-nav--current" data-au-parts=" ">
      <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces"></div>
          <button type="button" class="aun-rail__link" data-au-part="more">Load more</button>
        </div>
        <button type="button" class="aun-nav">Tasks</button>
        <button type="button" class="aun-nav">Settings</button>
      </aside>
    </article>

    <article data-au-component="sidebar-member" data-au-title="Sidebar, member open" data-au-note="The same rail while a workspace is open. That row is selected under Team." data-au-avalonia="Border" data-au-class="au-screen-rail">
      <aside class="au-rail au-screen-rail" aria-label="Sidebar">
        <div class="aun-nav-row">
          <button type="button" class="aun-nav aun-nav--current">Team</button>
          <button type="button" class="au-workspace-add" aria-label="Add workspace">+</button>
        </div>
        <div class="aun-nav-subs">
          <div data-au-demo="workspaces"></div>
        </div>
        <button type="button" class="aun-nav">Tasks</button>
        <button type="button" class="aun-nav">Settings</button>
      </aside>
    </article>

    <article data-au-component="settings-panel" data-au-title="Settings panel" data-au-note="Forge connection, capability modules, and Login. Each group has the same small headline." data-au-avalonia="Border" data-au-class="aun-settings">
      <div class="aun-settings">
        <div class="aun-group">
          <div data-au-use="section-label" data-au-props="label=Forge connection"></div>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Task source</span>
              <button class="aun-btn aun-btn--primary" type="button">Connect</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <div data-au-use="section-label" data-au-props="label=Capabilities"></div>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">.NET</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Docker</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Codex</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Cursor</span><span class="aun-settings__state">Disabled</span></span>
              <button class="aun-btn aun-btn--primary" type="button">Enable</button>
            </div>
            <div class="aun-settings__row">
              <span class="aun-settings__id"><span class="aun-settings__name">Claude</span><span class="aun-settings__state"><span class="au-status-dot au-status-dot--healthy"></span>Ready</span></span>
              <button class="aun-btn" type="button">Disable</button>
            </div>
          </div>
        </div>
        <div class="aun-group">
          <div data-au-use="section-label" data-au-props="label=Login"></div>
          <div class="aun-settings__list">
            <div class="aun-settings__row">
              <span class="aun-settings__name">Demo</span>
              <button class="aun-btn" type="button">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </article>

    <article data-au-component="settings-logout" data-au-title="Settings logout" data-au-note="The Server and Logout section. It lives on Settings, on Desktop and Mobile." data-au-avalonia="Border" data-au-class="au-drawer-server">
      <div class="aun-card">
        <p class="aun-rail__section">SERVER</p>
        <strong class="au-workspace-name">Demo</strong>
        <button class="au-session-logout" type="button">Logout</button>
      </div>
    </article>

    <article data-au-component="bridge-heading" data-au-title="Bridge heading" data-au-note="Desktop bridge title and the headline the view binds." data-au-avalonia="Border" data-au-class="aun-main">
      <div>
        <div data-au-use="page-title" data-au-props="title=Team"></div>
        <div data-au-demo="headline"></div>
      </div>
    </article>

    <article data-au-component="agent-state-map" data-au-title="Agent state map" data-au-note="Desktop fleet graph. Only lanes with an agent are drawn. A host's messages sit under the host." data-au-avalonia="Border" data-au-class="aun-state-map">
      <div class="aun-state-map" data-au-demo="fleet"></div>
    </article>

    <article data-au-component="bridge-task-table" data-au-title="Bridge tasks" data-au-note="The task table on the Desktop bridge." data-au-avalonia="Border" data-au-class="aun-card">
      <div class="aun-card" data-au-demo="reported"></div>
    </article>

    <article data-au-component="task-queue" data-au-title="Task queue" data-au-note="In progress, queue, and open issues, with the empty copy the Desktop queue shows after a read." data-au-avalonia="Border" data-au-class="aun-card">
      <div class="aun-card">
        <p class="aun-rail__section">QUEUE</p>
        <p class="aun-faint">Nothing is queued, so the agents have nothing to take. Pick an issue below.</p>
        <p class="aun-rail__section">OPEN ISSUES</p>
        <p class="aun-faint">Open a workspace to see the issues on its repository.</p>
      </div>
    </article>

    <article data-au-component="task-source" data-au-title="Task source" data-au-note="Where the Server's agents take work from." data-au-avalonia="Border" data-au-class="aun-card">
      <div class="aun-card" data-au-demo="source"></div>
    </article>

    <article data-au-component="train-panel" data-au-title="Train panel" data-au-note="The train block on the Desktop command center." data-au-avalonia="Border" data-au-class="aun-card">
      <div class="aun-card" data-au-demo="decisions"></div>
    </article>

    <article data-au-component="mobile-head-team" data-au-title="Mobile Team head" data-au-note="Team and the fleet headline. The phone has no drawer." data-au-avalonia="Border" data-au-class="aun-phone__head-row">
      <div class="aun-phone__head-row">
        <div class="aun-phone__head-copy"><div data-au-use="page-title" data-au-props="title=Team"></div><div data-au-demo="headline"></div></div>
      </div>
    </article>

    <article data-au-component="mobile-head-tasks" data-au-title="Mobile Tasks head" data-au-note="Tasks. The phone has no drawer." data-au-avalonia="Border" data-au-class="aun-phone__head-row">
      <div class="aun-phone__head-row">
        <div class="aun-phone__head-copy"><div data-au-use="page-title" data-au-props="title=Tasks"></div></div>
      </div>
    </article>

    <article data-au-component="mobile-head-settings" data-au-title="Mobile Settings head" data-au-note="Settings. The phone has no drawer." data-au-avalonia="Border" data-au-class="aun-phone__head-row">
      <div class="aun-phone__head-row">
        <div class="aun-phone__head-copy"><div data-au-use="page-title" data-au-props="title=Settings"></div></div>
      </div>
    </article>

    <article data-au-component="application-validation" data-au-title="Application validation" data-au-note="The right rail on Agent · Application. Status is the sidebar LED: green passed, yellow running, red failed, hollow not yet run." data-au-avalonia="Border" data-au-class="au-validation-sidebar">
      <aside class="au-validation-sidebar aun-validate-rail" aria-label="Validation" data-au-demo="rail"></aside>
    </article>

    <article data-au-component="application-dock" data-au-title="Application validation dock" data-au-note="50px under the open application. The dock starts with nothing selected, opens the dropup, selects the second flow, runs each of its checks, then opens the overview." data-au-avalonia="Border" data-au-class="aun-validate">
      <div class="aun-validate" data-au-demo="dock"></div>
    </article>

    <article data-au-component="mobile-application-head" data-au-title="Mobile application head" data-au-note="An open application is an inner page: a chevron back to Apps, and the application name. No tab bar and no reload." data-au-avalonia="Border" data-au-class="aun-agent-head">
      <div class="aun-agent-head">
        <button type="button" class="aun-agent-back" aria-label="Go back">‹</button>
        <div class="aun-phone__head-copy" data-au-demo="application"></div>
      </div>
    </article>

    <article data-au-component="mobile-agent-head" data-au-title="Mobile agent head" data-au-note="Back is a chevron, the workspace name sits above its branch, and Reload is accent text. No boxed control." data-au-avalonia="Border" data-au-class="aun-agent-head">
      <div class="aun-agent-head">
        <button type="button" class="aun-agent-back" aria-label="Back to the team">‹</button>
        <div class="aun-phone__head-copy" data-au-demo="member"></div>
        <button type="button" class="aun-agent-reload">Reload</button>
      </div>
    </article>

    <article data-au-component="mobile-tabs-apps" data-au-title="Agent tabs, Apps" data-au-note="Apps, Git, Chat. Apps selected. The accent underline is the catalog tab." data-au-avalonia="Border" data-au-class="au-tabs">
      <nav class="au-tabs" aria-label="Agent sections"><button class="au-tab au-tab--selected" type="button" aria-selected="true">Apps</button><button class="au-tab" type="button">Git</button><button class="au-tab" type="button">Chat</button></nav>
    </article>

    <article data-au-component="mobile-tabs-git" data-au-title="Agent tabs, Git" data-au-note="Apps, Git, Chat. Git selected." data-au-avalonia="Border" data-au-class="au-tabs">
      <nav class="au-tabs" aria-label="Agent sections"><button class="au-tab" type="button">Apps</button><button class="au-tab au-tab--selected" type="button" aria-selected="true">Git</button><button class="au-tab" type="button">Chat</button></nav>
    </article>

    <article data-au-component="mobile-tabs-chat" data-au-title="Agent tabs, Chat" data-au-note="Apps, Git, Chat. Chat selected." data-au-avalonia="Border" data-au-class="au-tabs">
      <nav class="au-tabs" aria-label="Agent sections"><button class="au-tab" type="button">Apps</button><button class="au-tab" type="button">Git</button><button class="au-tab au-tab--selected" type="button" aria-selected="true">Chat</button></nav>
    </article>

    <article data-au-component="mobile-tabbar" data-au-title="Command tabs" data-au-note="Team, Tasks, Settings. The phone bar is these three. Unselected icons sit at 55% opacity." data-au-avalonia="Border" data-au-class="au-mobile-tab-bar" data-au-states="selected=au-nav-tab/au-subtab--selected">
      <div class="au-mobile-tab-bar" role="tablist">
        <button class="au-subtab au-nav-tab" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.2a3.8 3.8 0 0 0-3.8-3.8H6.8A3.8 3.8 0 0 0 3 17.8V19"></path><circle cx="9" cy="7.2" r="3.2"></circle><path d="M21 19v-1.2a3.8 3.8 0 0 0-2.9-3.7"></path><path d="M16.2 4.2a3.2 3.2 0 0 1 0 6"></path></svg>
          Team
        </button>
        <button class="au-subtab au-nav-tab" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="m3.5 5.8 1.3 1.3L7.4 4.5"></path><path d="m3.5 11.8 1.3 1.3L7.4 10.5"></path><path d="M4 18h1.5"></path></svg>
          Tasks
        </button>
        <button class="au-subtab au-nav-tab" type="button">
          <svg class="au-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </article>

    <article data-au-component="mobile-state-map" data-au-title="Mobile state map" data-au-note="The same fleet graph, stacked for the phone." data-au-avalonia="Border" data-au-class="aun-state-map">
      <div class="aun-state-map aun-state-map--mobile" data-au-demo="fleet"></div>
    </article>

    <article data-au-component="task-board" data-au-title="Task board" data-au-note="The Demo queue: one task in progress, two waiting, and three open issues. Desktop keeps the page title; the phone puts that title in its head." data-au-avalonia="Border" data-au-class="aun-task-board" data-au-parts="title">
      <div class="aun-task-board" data-au-demo="queue"></div>
    </article>

    <article data-au-component="mobile-settings" data-au-title="Mobile settings" data-au-note="Interface and task source. Capability modules and logout are their own sections." data-au-avalonia="Border" data-au-class="aun-card">
      <div>
        <p class="aun-rail__section">INTERFACE</p>
        <p class="aun-rail__section">TASK SOURCE</p>
      </div>
    </article>

    <article data-au-component="member-overview" data-au-title="Member overview" data-au-note="The open workspace, read from the Demo definition." data-au-avalonia="Border" data-au-class="au-overview">
      <div data-au-demo="overview"></div>
    </article>

    <article data-au-component="mobile-chat" data-au-title="Mobile chat" data-au-note="The shared chat composer." data-au-avalonia="Border" data-au-class="aun-wrap">
      <div>
        <textarea class="aun-input" placeholder="Ask the agent…"></textarea>
        <button type="button" class="aun-btn aun-btn--primary">Send</button>
      </div>
    </article>

  </section>
</body>
</html>
