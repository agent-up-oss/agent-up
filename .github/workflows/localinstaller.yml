name: LocalInstaller CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build-test-pack:
    name: Build, test, and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build localinstaller.sln --configuration Release

      - name: Test
        run: >
          dotnet test localinstaller.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack localinstaller.sln --configuration Release --no-build --output nupkgs

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          name: localinstaller-nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests (LocalInstaller - ${{ matrix.os }})
          path: "**/test-results.trx"
          reporter: dotnet-trx

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-test-pack
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install release tooling
        run: npm install

      - uses: actions/download-artifact@v8
        with:
          name: localinstaller-nupkgs
          path: nupkgs

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: node .github/scripts/localinstaller-release.js
