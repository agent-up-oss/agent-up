name: Agent-Up CI

on: [push]

concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main'
      && format('{0}-main-release', github.workflow)
      || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plugin_changed: ${{ steps.plugin-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install release tooling
        run: npm install

      - name: Plan version
        id: plan
        run: node .github/scripts/plan-version.js

      - name: Detect plugin changes
        id: plugin-changes
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- Plugins/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - uses: mikefarah/yq@v4

      - name: Lint and package chart
        run: ./.github/scripts/verify-chart.sh

  dotnet-build:
    name: .NET payloads
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX agent-up.sln --json --out artifacts/sbom --set-version "${{ needs.version.outputs.version }}"
          mv artifacts/sbom/bom.json artifacts/sbom/agent-up-sbom.cdx.json

      - name: Publish .NET CI artifacts
        shell: bash
        run: |
          ./.github/scripts/publish-dotnet-ci-artifacts.sh "${{ needs.version.outputs.version }}" "artifacts/dotnet-ci"

      - name: Prepare per-platform .NET CI artifacts
        shell: bash
        run: |
          rm -rf artifacts/ci-transfer
          for entry in \
            ubuntu-linux-x64:linux-x64 \
            nixos-linux-x64:linux-x64 \
            macos-osx-arm64:osx-arm64 \
            macos-osx-x64:osx-x64 \
            windows-win-x64:win-x64
          do
            platform_rid="${entry%%:*}"
            rid="${entry##*:}"
            target="artifacts/ci-transfer/$platform_rid/dotnet-ci"
            mkdir -p "$target/tools/$rid" "$target/payloads"
            cp -a "artifacts/dotnet-ci/tools/$rid/packaging" "$target/tools/$rid/"
            cp -a "artifacts/dotnet-ci/tools/$rid/package-smoke" "$target/tools/$rid/"
            cp -a "artifacts/dotnet-ci/payloads/$rid" "$target/payloads/"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-ubuntu-linux-x64
          path: artifacts/ci-transfer/ubuntu-linux-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-nixos-linux-x64
          path: artifacts/ci-transfer/nixos-linux-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-macos-osx-arm64
          path: artifacts/ci-transfer/macos-osx-arm64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-macos-osx-x64
          path: artifacts/ci-transfer/macos-osx-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-windows-win-x64
          path: artifacts/ci-transfer/windows-win-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom/agent-up-sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: bash
        run: ./.github/scripts/run-dotnet-tests.sh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests (Agent-Up)
          path: "**/test-results.trx"
          reporter: dotnet-trx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 1

  dotnet-gui-tests:
    name: .NET GUI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Ubuntu browser test dependencies
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Run GUI tests
        shell: bash
        run: ./.github/scripts/run-dotnet-gui-tests.sh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET GUI Tests (Agent-Up)
          path: "**/test-results.trx,**/e2e-results.trx"
          reporter: dotnet-trx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dotnet-gui-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 1

  dotnet-coverage:
    name: .NET coverage
    runs-on: ubuntu-latest
    needs: [dotnet-tests, dotnet-gui-tests]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: dotnet-test-results
          path: artifacts/test-results

      - uses: actions/download-artifact@v8
        with:
          name: dotnet-gui-test-results
          path: artifacts/test-results

      - name: Locate module coverage reports
        id: coverage-reports
        shell: bash
        run: ./.github/scripts/locate-coverage-reports.sh

      - name: Upload AgentUp.Architecture.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_architecture_tests }}
          flags: agentup-architecture-tests
          name: AgentUp.Architecture.Tests
          fail_ci_if_error: true
          disable_search: true
          verbose: true

      - name: Upload AgentUp.CLI.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_cli_tests }}
          flags: agentup-cli-tests
          name: AgentUp.CLI.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Abstractions.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_abstractions_tests }}
          flags: agentup-capabilities-abstractions-tests
          name: AgentUp.Capabilities.Abstractions.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Common.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_common_tests }}
          flags: agentup-capabilities-common-tests
          name: AgentUp.Capabilities.Common.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Claude.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_claude_tests }}
          flags: agentup-capabilities-claude-tests
          name: AgentUp.Capabilities.Claude.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Codex.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_codex_tests }}
          flags: agentup-capabilities-codex-tests
          name: AgentUp.Capabilities.Codex.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Cursor.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_cursor_tests }}
          flags: agentup-capabilities-cursor-tests
          name: AgentUp.Capabilities.Cursor.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Docker.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_docker_tests }}
          flags: agentup-capabilities-docker-tests
          name: AgentUp.Capabilities.Docker.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Dotnet.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_dotnet_tests }}
          flags: agentup-capabilities-dotnet-tests
          name: AgentUp.Capabilities.Dotnet.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.CommitPolicy.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_commit_policy_tests }}
          flags: agentup-commit-policy-tests
          name: AgentUp.CommitPolicy.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Desktop.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_desktop_tests }}
          flags: agentup-desktop-tests
          name: AgentUp.Desktop.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Server.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_server_tests }}
          flags: agentup-server-tests
          name: AgentUp.Server.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_tests }}
          flags: agentup-tests
          name: AgentUp.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Verification.Tests coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_verification_tests }}
          flags: agentup-verification-tests
          name: AgentUp.Verification.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Enforce patch coverage
        shell: bash
        run: |
          # Test jobs wrote Cobertura reports under artifacts/test-results. The
          # coverage gate searches its report directory recursively, so making the whole
          # tree visible there is enough; it then measures only the lines this change
          # touched, against the minimum in agent-up.json.
          mkdir -p artifacts/coverage
          cp -r artifacts/test-results/. artifacts/coverage/

          dotnet build AgentUp.CLI/AgentUp.CLI.csproj --configuration Release
          dotnet run --project AgentUp.CLI --configuration Release --no-build --no-launch-profile -- verify coverage

  # Keep this job id so platform/release still gate on the same check name.
  # The four jobs above run in parallel; this aggregator fails unless every one succeeded.
  dotnet-build-test:
    name: .NET build, tests, and payloads
    runs-on: ubuntu-latest
    needs: [dotnet-build, dotnet-tests, dotnet-gui-tests, dotnet-coverage]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Require .NET CI jobs
        env:
          DOTNET_BUILD: ${{ needs.dotnet-build.result }}
          DOTNET_TESTS: ${{ needs.dotnet-tests.result }}
          DOTNET_GUI_TESTS: ${{ needs.dotnet-gui-tests.result }}
          DOTNET_COVERAGE: ${{ needs.dotnet-coverage.result }}
        run: |
          status=0
          for name in DOTNET_BUILD DOTNET_TESTS DOTNET_GUI_TESTS DOTNET_COVERAGE; do
            result="${!name}"
            echo "$name=$result"
            if [ "$result" != success ]; then
              status=1
            fi
          done
          exit "$status"

  jetbrains-plugin:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JetBrains plugin
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        run: |
          ./gradlew --no-daemon test buildPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"
          mkdir -p ../../artifacts/jetbrains-plugin
          cp "build/distributions/agent-up-jetbrains-${{ needs.version.outputs.version }}.zip" \
            "../../artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip"

      - uses: actions/upload-artifact@v7
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip
          if-no-files-found: error
          retention-days: 1

  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [dotnet-build-test, version]
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu package
            os: ubuntu-latest
            platform: ubuntu
            rid: linux-x64
            use-nix: false
          - name: NixOS package
            os: ubuntu-latest
            platform: nixos
            rid: linux-x64
            use-nix: true
          - name: macOS Apple Silicon package
            os: macos-latest
            platform: macos
            rid: osx-arm64
            use-nix: false
          - name: macOS Intel package
            os: macos-15-intel
            platform: macos
            rid: osx-x64
            use-nix: false
          - name: Windows package
            os: windows-latest
            platform: windows
            rid: win-x64
            use-nix: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22
        if: ${{ matrix.use-nix }}

      - uses: actions/download-artifact@v8
        with:
          name: dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}
          path: dotnet-ci

      - name: Delete consumed .NET CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" 2>/dev/null | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          fi

      - name: Mark downloaded tools executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging" || true
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/desktop/AgentUp.Desktop" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/server/AgentUp.Server" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/cli/AgentUp.CLI" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/tray/AgentUp.Tray" || true
          fi

      - name: Sign macOS payload binaries
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-macos-payload.sh "${{ matrix.rid }}" "dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign Windows payload binaries
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: dotnet-ci/payloads/win-x64
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows payload signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target payload -Dir dotnet-ci/payloads/win-x64

      - name: Package release artifact
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGING_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging$tool_suffix"
          ./scripts/package-release.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "${{ needs.version.outputs.version }}" "release-artifacts" \
            --payload-root "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign and notarize macOS package
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-notarize-macos.sh "${{ matrix.rid }}" "release-artifacts"

      - name: Sign Windows package artifacts
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: release-artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows package signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target package -Dir release-artifacts

      - name: Sign Linux package
        if: ${{ matrix.platform == 'ubuntu' && (vars.LINUX_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-linux.sh "release-artifacts"

      - name: Smoke test packaged artifact
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-package.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - name: Smoke test guided installer flow
        if: ${{ matrix.platform != 'nixos' }}
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp$tool_suffix"
          export AGENTUP_INSTALLER_FAKE=1
          ./.github/scripts/smoke-installer-flow.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer app startup
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-startup.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer elevation
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-elevation.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Allow installed-service smoke environment through sudo
        if: ${{ matrix.platform == 'ubuntu' }}
        shell: bash
        run: |
          echo 'Defaults env_keep += "AGENTUP_PACKAGE_SMOKE_AUTH_DISABLED"' | sudo tee /etc/sudoers.d/agentup-smoke-env
          sudo chmod 0440 /etc/sudoers.d/agentup-smoke-env

      - name: Smoke test installed service
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
            # Windows runner only has Docker Engine (Windows container mode); Linux containers
            # like nginx:alpine cannot run there. Docker capability is covered by Linux/macOS jobs.
            export AGENTUP_CAPABILITY_SMOKE_SKIP_REAL=1
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-installed-service.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.rid }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  docs:
    name: Docs
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build docs
        run: |
          npm --prefix docs ci
          npm --prefix docs run build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [platform, docs, jetbrains-plugin, version, helm-chart]
    if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true' }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install release tooling
        run: npm install

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - uses: mikefarah/yq@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: release-artifacts

      - uses: actions/download-artifact@v8
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: release-artifacts

      - name: Delete consumed package and SBOM artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select((.name | startswith("package-")) or .name == "sbom" or .name == "jetbrains-plugin") | .id' |
            while IFS= read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
              fi
            done

      - name: Prepare release artifacts
        env:
          INCLUDE_JETBRAINS_PLUGIN: ${{ needs.version.outputs.plugin_changed }}
        run: ./.github/scripts/upload-release-artifacts.sh "${{ needs.version.outputs.version }}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish browser audit client to npm
        working-directory: AgentUp.WebAudit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Skipping npm publish because NPM_TOKEN is not configured."
            exit 0
          fi

          npm ci
          npm test
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

          if npm view "@agent-up/audit@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@agent-up/audit@$RELEASE_VERSION is already published; skipping."
            exit 0
          fi

          npm publish --access public

      - name: Publish JetBrains plugin to Marketplace
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Skipping JetBrains Marketplace publish because JETBRAINS_MARKETPLACE_TOKEN is not configured."
            exit 0
          fi

          ./gradlew --no-daemon publishPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"
