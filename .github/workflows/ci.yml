        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_server_tests }}
          flags: agentup-server-tests
          name: AgentUp.Server.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.TestAgents.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_test_agents_tests }}
          flags: agentup-test-agents-tests
          name: AgentUp.TestAgents.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Verification.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_verification_tests }}
          flags: agentup-verification-tests
          name: AgentUp.Verification.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Opencode.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_opencode_tests }}
          flags: agentup-capabilities-opencode-tests
          name: AgentUp.Capabilities.Opencode.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Browser.Streaming.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_browser_streaming_tests }}
          flags: agentup-browser-streaming-tests
          name: AgentUp.Browser.Streaming.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Tray.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_tray_tests }}
          flags: agentup-tray-tests
          name: AgentUp.Tray.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.InstallerConfig.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_installer_config_tests }}
          flags: agentup-installer-config-tests
          name: AgentUp.InstallerConfig.Tests
          fail_ci_if_error: true
          disable_search: true

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: coverage
          status: ${{ job.status }}

  source-typescript:
    name: Source · TypeScript and design-system suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # plan-mobile-version.test.js reads tags.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: ./.github/scripts/install-mobile-deps.sh

      - name: Typecheck and unit test
        working-directory: AgentUp.Mobile
        run: |
          npm --prefix ../AgentUp.AgentAuth test
          npx tsc --noEmit -p tsconfig.test.json
          npx tsc --noEmit -p ../AgentUp.ServerClient/tsconfig.json
          npx tsx --test ../AgentUp.ServerClient/src/*.test.ts
          npx tsx --test ../AgentUp.Chat/src/providers/*.test.ts
          npx tsx --test src/features/**/*.test.ts
          node --test scripts/*.test.mjs

      - name: WebAudit unit tests
        working-directory: AgentUp.WebAudit
        run: |
          npm ci
          npm test

      # The design system's own suite: one palette, catalog-only paint, scenes the command
      # centers mount, and every rule that keeps it the only visual source. It never ran in CI
      # before, and had drifted.
      - name: Design-system suite
        run: |
          npm --prefix AgentUp.DesignSystem ci
          npm --prefix AgentUp.DesignSystem test

      - name: Typecheck the chat module and the app that harnesses it
        run: |
          npm --prefix AgentUp.Chat run typecheck
          npm --prefix AgentUp.Mobile.E2E.App install --no-audit --no-fund
          npx --prefix AgentUp.Mobile.E2E.App tsc --noEmit -p AgentUp.Mobile.E2E.App/tsconfig.json

      - name: Check the shared sign-in module's committed build is current
        shell: bash
        run: |
          # Cloudflare Pages builds the web client with one script and cannot build sibling
          # packages, so their dist/ is committed. That only works while it is in step with src.
          npm --prefix AgentUp.AgentAuth run build
          git diff --exit-code -- AgentUp.AgentAuth/dist

      - name: Check the end-to-end suite for fixed delays
        working-directory: AgentUp.Mobile.E2E
        run: node scripts/forbid-sleep.mjs

      - name: Test the end-to-end harness
        working-directory: AgentUp.Mobile.E2E
        run: node --test test/*.test.mjs

      # The sign-in jobs run these on a macOS runner, whose bash is 3.2. A construct newer than
      # that fails there and nowhere else, at the first step that uses it.
      - name: Test this workflow's own scripts and behavior matrix
        run: |
          node .github/scripts/check-shell-portability.mjs
          node --test .github/scripts/*.test.mjs .github/scripts/*.test.js
          ./.github/scripts/install-ubuntu-browser-test-deps.test.sh
          node .github/scripts/behavior-matrix.mjs check

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: typescript
          status: ${{ job.status }}

  source-budgets:
    name: Source · test-tier budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install GUI watchdog dependencies
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Restore .NET projects
        run: dotnet restore agent-up.sln

      - name: Build Release test payloads
        run: dotnet build agent-up.sln --configuration Release --no-restore

      - name: Enforce test-kind wall-clock budgets
        run: ./.github/scripts/run-test-kind-watchdog.sh

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: source-budgets-results
          path: artifacts/test-kind-watchdog/*.trx
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: budgets
          status: ${{ job.status }}

  source-performance:
    name: Source · performance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AgentUp.Mobile/package-lock.json

      - name: Restore .NET projects
        run: dotnet restore agent-up.sln

      - name: Build Release test payloads
        run: dotnet build agent-up.sln --configuration Release --no-restore

      - name: Run .NET performance regression gates
        run: |
          ./scripts/run-benchmark-gate.sh browser
          ./scripts/run-benchmark-gate.sh server

      - name: Run Mobile performance regression gate
        working-directory: AgentUp.Mobile
        run: |
          npm ci --ignore-scripts
          npx tsx src/features/agents/benchmark/MobilePerformanceGate.ts

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: performance
          status: ${{ job.status }}

  # ── Backend: one contract, three implementations ─────────────────────────────────────────────

  # AgentUp.FakeServer/parity.json classifies every operation in the API reference as one the
  # Demo answers or one only a real Server can. Each leg holds its own implementation to that one
  # manifest, so a route added to the Server, or to one Demo but not the other, turns a leg red.
  backend:
    name: Backend · ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: server
            title: Server
          - leg: demo-desktop
            title: Demo (Desktop)
          - leg: demo-mobile
            title: Demo (Mobile)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.leg != 'demo-mobile' }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Hold ${{ matrix.title }} to the parity manifest
        run: ./.github/scripts/run-backend-parity.sh ${{ matrix.leg }}

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: backend
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Integration: one leg per real external dependency ────────────────────────────────────────

  integration:
    name: Integration · ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: forgejo
            title: Forgejo host
            run: ./.github/scripts/run-forgejo-e2e.sh
            results: forgejo-e2e
            timeout: 20
          - leg: team-forgejo
            title: Agent team on Forgejo
            run: ./.github/scripts/run-agent-e2e.sh TeamForgejoE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: agent-sandbox
            title: Agent sandbox
            run: ./.github/scripts/run-agent-e2e.sh AgentSandboxE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: agent-mcp
            title: Agent over MCP
            run: ./.github/scripts/run-agent-e2e.sh AgentMcpE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: cpu-inference
            title: Loop on CPU inference
            run: ./.github/scripts/run-loop-inference.sh
            results: loop-inference
            model: true
            timeout: 60
          - leg: opencode
            title: OpenCode on CPU inference
            run: ./.github/scripts/run-opencode-inference.sh
            results: opencode-inference
            model: true
            nix: true
            timeout: 60
          - leg: runtime-capabilities
            title: Runtime capabilities
            run: ./.github/scripts/run-runtime-capability-e2e.sh
            results: runtime-capability-e2e
            nix: true
            display: true
            timeout: 40
          - leg: loop-soak
            title: Loop soak
            run: ./.github/scripts/run-loop-soak.sh
            results: loop-soak
            timeout: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The runtime-capability workspace runs `npm install` for Docs before it can serve. Example
      # Web installs with --package-lock=false and shares the same warmed ~/.npm.
      - uses: actions/setup-node@v7
        if: ${{ matrix.display }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Pinned GGUF shared by the CPU-inference and OpenCode legs; the model server and the loop
      # both SHA-check what they load from it.
      - uses: actions/cache@v6
        if: ${{ matrix.model }}
        with:
          path: ~/.cache/agent-up/models
          key: loop-inference-gguf-${{ hashFiles('AgentUp.TestAgents/Features/Inference/Models/GgufModelSpec.cs') }}

      # Capabilities deliver toolchains through Nix and the Server confines agents with Nix's
      # bubblewrap, so these legs need Nix the way a real Server host does.
      - uses: DeterminateSystems/nix-installer-action@v23
        if: ${{ matrix.nix }}

      - name: Install Ubuntu browser test dependencies
        if: ${{ matrix.display }}
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Run against ${{ matrix.title }}
        shell: bash
        run: ${{ matrix.run }}

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && hashFiles(format('artifacts/test-results/{0}/*.trx', matrix.results)) != '' }}
        with:
          name: Integration · ${{ matrix.title }}
          path: artifacts/test-results/${{ matrix.results }}/*.trx
          reporter: dotnet-trx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-${{ matrix.leg }}-results
          path: artifacts/test-results/${{ matrix.results }}
          if-no-files-found: warn
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: integration
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Frontend: client × shell × backend × native display ──────────────────────────────────────

  # The QA flows of docs/developer-guide/verification/qa-coverage.md, replayed against an isolated
  # real Server. Before this job they ran only when someone remembered au-debug validate, and two
  # of them had drifted from the shipping UI without anyone seeing it.
  journeys:
    name: Journeys · ${{ matrix.title }} · real Server
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: journeys-desktop
            title: Desktop
            surface: desktop
          - leg: journeys-mobile
            title: Mobile
            surface: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentUp.Mobile/package-lock.json
            AgentUp.Mobile.E2E/package-lock.json

      - name: Install Ubuntu desktop dependencies
        if: ${{ matrix.surface == 'desktop' }}
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Replay every ${{ matrix.title }} journey
        shell: bash
        run: ./.github/scripts/run-journeys.sh ${{ matrix.surface }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: journeys-${{ matrix.surface }}
          path: artifacts/${{ matrix.surface }}-validation
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # The real clients against their built-in Demo backend, driven through every screen the design
  # system documents under Assembled screens and photographed in a used state. Reaching every
  # screen gates; the old Product screens job ran with continue-on-error and had been capturing
  # 10 of 30 screens unnoticed. Mobile is then compared with the copy the design system shows for
  # each screen; Desktop cannot report its own text yet. One client per job: Mobile used to flake
  # waiting for its first paint on a runner that Desktop capture had just saturated.
  showcase:
    name: Showcase · ${{ matrix.title }} · Demo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: showcase-desktop
            title: Desktop
            surface: desktop
          - leg: showcase-mobile
            title: Mobile
            surface: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentUp.Mobile/package-lock.json

      - name: Install Ubuntu browser test dependencies
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      # xdotool drives the Desktop window and ImageMagick's import captures it.
      - name: Install window capture dependencies
        if: ${{ matrix.surface == 'desktop' }}
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 xdotool imagemagick libsm6 libice6

      - name: Capture every documented ${{ matrix.title }} screen on the Demo
        shell: bash
        run: ./.github/scripts/capture-product-screens.sh ${{ matrix.surface }}

      # Reported, not yet gating: every Mobile screen currently diverges from the copy the
      # showcase documents (a declared gap in .github/behavior-matrix.json). The report lands on
      # the run summary and the step shows as a warning until the showcase is re-authored.
      - name: Compare the captured screens with the design system
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./au-debug screens compare ${{ matrix.surface }} 2>&1 | tee "$RUNNER_TEMP/compare.txt"
          {
            echo "### ${{ matrix.title }} screens against the design system"
            echo
            echo '```'
            cat "$RUNNER_TEMP/compare.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: showcase-${{ matrix.surface }}
          path: artifacts/product-screens
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # Agent sign-in is the one thing in this repository that needs a simulator, an emulator and a
  # browser to prove. Each job publishes the Server and test agents itself, while it is already
  # busy provisioning an emulator or an Xcode toolchain, rather than waiting on Build: an artifact
  # dependency would serialise the slowest jobs in the pipeline behind the next slowest. What
  # bounds their cost is the cache - an unchanged client reuses the app it already built.
  sign-in-web:
    name: Sign-in · installable web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # What these jobs install, which is the harness app and the modules it mounts - not
          # the full client, which they never build.
          cache-dependency-path: |
            AgentUp.Mobile.E2E.App/package-lock.json
            AgentUp.Mobile.E2E/package-lock.json
            AgentUp.Chat/package-lock.json
            AgentUp.AgentAuth/package-lock.json
            AgentUp.ServerClient/package-lock.json
            AgentUp.WebAudit/package-lock.json

      - name: Publish the Server and test agents
        run: ./.github/scripts/build-mobile-e2e-stack.sh

      # The Server confines agents with bubblewrap on Linux; macOS runs them unconfined.
      - name: Install bubblewrap
        run: ./.github/scripts/install-bubblewrap.sh

      - name: Install mobile dependencies
        run: ./.github/scripts/install-mobile-deps.sh AgentUp.Mobile.E2E.App

      - name: Export the installable web build
        working-directory: AgentUp.Mobile.E2E.App
        run: npx expo export --platform web --output-dir dist

      # The browser is a fixed ~140MB download that changes only when Playwright does.
      - name: Restore the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('AgentUp.Mobile.E2E/package.json') }}

      - name: Install Playwright
        working-directory: AgentUp.Mobile.E2E
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run sign-in end-to-end
        working-directory: AgentUp.Mobile.E2E
        env:
          AGENTUP_E2E_WEB_EXPORT: ../AgentUp.Mobile.E2E.App/dist
        run: npm run test:pwa

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: sign-in-web-artifacts
          path: AgentUp.Mobile.E2E/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: sign-in-web
          status: ${{ job.status }}

  sign-in-android:
    name: Sign-in · Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentUp.Mobile.E2E.App/package-lock.json
            AgentUp.Mobile.E2E/package-lock.json
            AgentUp.Chat/package-lock.json
            AgentUp.AgentAuth/package-lock.json
            AgentUp.ServerClient/package-lock.json
            AgentUp.WebAudit/package-lock.json

      - name: Check emulator wake helpers
        run: node --test .github/scripts/android-emulator-focus.test.mjs .github/scripts/install-android-emulator.test.mjs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Describe what the app is built from
        id: app
        shell: bash
        run: ./.github/scripts/mobile-app-key.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The app is a function of the client's sources and its dependency set, so a push that
      # changed neither - the Server, the test agents, the suites themselves - reuses the one the
      # last run compiled instead of spending ten minutes reaching the same bytes.
      - name: Restore the app under test
        id: apk
        uses: actions/cache/restore@v6
        with:
          path: AgentUp.Mobile.E2E.App/android/app/build/outputs/apk
          key: android-app-${{ steps.app.outputs.key }}

      - name: Check the restored app is complete
        id: restored
        shell: bash
        run: ./.github/scripts/mobile-app-restored.sh android

      - name: Publish the Server and test agents
        run: ./.github/scripts/build-mobile-e2e-stack.sh

      # The Server confines agents with bubblewrap on Linux; macOS runs them unconfined.
      - name: Install bubblewrap
        run: ./.github/scripts/install-bubblewrap.sh

      # Only the build needs the client's dependencies, so a run that reuses the app skips them.
      - name: Install mobile dependencies
        if: ${{ steps.restored.outputs.usable != 'true' }}
        run: ./.github/scripts/install-mobile-deps.sh AgentUp.Mobile.E2E.App

      - name: Generate the native project
        if: ${{ steps.restored.outputs.usable != 'true' }}
        working-directory: AgentUp.Mobile.E2E.App
        run: npx expo prebuild --platform android --no-install

      # Nothing on the runner preinstalls the NDK this build wants, so Gradle fetches it mid-build
      # in one attempt. Here it is a step that can be retried instead of a build that cannot.
      - name: Install the Android NDK the build will ask for
        if: ${{ steps.restored.outputs.usable != 'true' }}
        run: ./.github/scripts/install-android-ndk.sh AgentUp.Mobile.E2E.App

      - uses: gradle/actions/setup-gradle@v6
        if: ${{ steps.restored.outputs.usable != 'true' }}
        with:
          # Off by default on anything but the default branch, which means a branch never seeds
          # the cache it is about to need.
          cache-read-only: false

      - name: Install the end-to-end runner
        working-directory: AgentUp.Mobile.E2E
        run: npm install --no-audit --no-fund

      - name: Build the app under test
        if: ${{ steps.restored.outputs.usable != 'true' }}
        working-directory: AgentUp.Mobile.E2E
        run: npx detox build --configuration android.emu.release

      # Saved here rather than at the end of the job: a run whose tests fail would otherwise throw
      # the build away and recompile it on the next push, which is exactly when iteration is
      # happening and speed matters most.
      - name: Keep the app under test
        if: ${{ steps.restored.outputs.usable != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: AgentUp.Mobile.E2E.App/android/app/build/outputs/apk
          key: android-app-${{ steps.app.outputs.key }}

      - name: Restore the emulator
        id: avd
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-google_apis-x86_64-pixel_6

      # Creating the image and letting it write a snapshot costs minutes. Doing it in its own step
      # means it happens once per image, not once per run. Verified, not trusted: a restore that
      # came back short would otherwise skip the creation that would have fixed it.
      - name: Check the restored emulator is complete
        id: emulator
        shell: bash
        run: |
          if [ -f ~/.android/avd/agent_up_e2e.ini ] && [ -d ~/.android/avd/agent_up_e2e.avd ]; then
            echo "present: the agent_up_e2e emulator image"
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "MISSING: the agent_up_e2e emulator image; creating it."
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      # Same truncated-zip failure as the NDK: android-emulator-runner installs the emulator and
      # the system image once each and fails the job when Google's archive is not an archive.
      # Retry here first so the action's own install is a no-op.
      - name: Install the Android emulator
        run: ./.github/scripts/install-android-emulator.sh

      - name: Create the emulator
        if: ${{ steps.emulator.outputs.usable != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: agent_up_e2e
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator image created."

      - name: Run sign-in end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: agent_up_e2e
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./.github/scripts/wake-android-emulator.sh
            cd AgentUp.Mobile.E2E && npm run test:android -- --headless

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: sign-in-android-artifacts
          path: AgentUp.Mobile.E2E/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: sign-in-android
          status: ${{ job.status }}

  sign-in-ios:
    name: Sign-in · iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentUp.Mobile.E2E.App/package-lock.json
            AgentUp.Mobile.E2E/package-lock.json
            AgentUp.Chat/package-lock.json
            AgentUp.AgentAuth/package-lock.json
            AgentUp.ServerClient/package-lock.json
            AgentUp.WebAudit/package-lock.json

      - name: Describe what the app is built from
        id: app
        shell: bash
        run: ./.github/scripts/mobile-app-key.sh

      # The app is a function of the client's sources and its dependency set, so a push that
      # changed neither reuses the one the last run compiled instead of spending eighteen minutes
      # reaching the same bytes.
      - name: Restore the app under test
        id: built-app
        uses: actions/cache/restore@v6
        with:
          path: AgentUp.Mobile.E2E.App/ios/build/Build/Products/Release-iphonesimulator
          key: ios-app-${{ steps.app.outputs.key }}

      - name: Check the restored app is complete
        id: restored
        shell: bash
        run: ./.github/scripts/mobile-app-restored.sh ios

      - name: Publish the Server and test agents
        run: ./.github/scripts/build-mobile-e2e-stack.sh

      # Only the build needs the client's dependencies, so a run that reuses the app skips them.
      - name: Install mobile dependencies
        if: ${{ steps.restored.outputs.usable != 'true' }}
        run: ./.github/scripts/install-mobile-deps.sh AgentUp.Mobile.E2E.App

      - name: Generate the native project
        if: ${{ steps.restored.outputs.usable != 'true' }}
        working-directory: AgentUp.Mobile.E2E.App
        run: npx expo prebuild --platform ios --no-install

      # Pods and their compiled objects are the bulk of that build and change only when the
      # dependency set does, so a client-only change relinks instead of recompiling the world.
      - name: Restore the pods and their objects
        if: ${{ steps.restored.outputs.usable != 'true' }}
        id: pods
        uses: actions/cache/restore@v6
        with:
          path: |
            AgentUp.Mobile.E2E.App/ios/Pods
            AgentUp.Mobile.E2E.App/ios/build/Build/Intermediates.noindex
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ steps.app.outputs.dependencies }}

      - name: Install pods
        if: ${{ steps.restored.outputs.usable != 'true' }}
        working-directory: AgentUp.Mobile.E2E.App/ios
        run: pod install

      - name: Install the end-to-end runner
        working-directory: AgentUp.Mobile.E2E
        run: |
          npm install --no-audit --no-fund
          # Detox needs applesimutils to drive the simulator. Homebrew refuses formulae from a
          # third-party tap until the tap is trusted.
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils

      - name: Choose the simulator
        shell: bash
        run: |
          # Pinning a runtime version fails outright when the runner image moves on, so the newest
          # iPhone the image ships is resolved and logged instead. The choice is recorded in the
          # run, so a behaviour change between runs is still traceable.
          device="$(xcrun simctl list devicetypes --json \
            | python3 -c "import json,sys;print(max((d['name'] for d in json.load(sys.stdin)['devicetypes'] if d['name'].startswith('iPhone')), key=lambda n:[int(p) for p in n.split() if p.isdigit()] or [0]))")"
          echo "Using simulator: $device"
          echo "AGENTUP_E2E_IOS_DEVICE=$device" >> "$GITHUB_ENV"

      - name: Build the app under test
        if: ${{ steps.restored.outputs.usable != 'true' }}
        working-directory: AgentUp.Mobile.E2E
        run: npx detox build --configuration ios.sim.release

      - name: Keep the app under test
        if: ${{ steps.restored.outputs.usable != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: AgentUp.Mobile.E2E.App/ios/build/Build/Products/Release-iphonesimulator
          key: ios-app-${{ steps.app.outputs.key }}

      - name: Keep the pods and their objects
        if: ${{ steps.restored.outputs.usable != 'true' && steps.pods.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            AgentUp.Mobile.E2E.App/ios/Pods
            AgentUp.Mobile.E2E.App/ios/build/Build/Intermediates.noindex
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ steps.app.outputs.dependencies }}

      - name: Run sign-in end-to-end
        working-directory: AgentUp.Mobile.E2E
        run: npm run test:ios -- --headless

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: sign-in-ios-artifacts
          path: AgentUp.Mobile.E2E/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: sign-in-ios
          status: ${{ job.status }}

  # AgentUp.Tests on a real display: the WebView upload bridge, OAuth through redirects and native
  # popups, streamed desktop applications and the installer dashboard. Linux builds and runs it from
  # source; macOS and Windows run the framework-dependent runner Build published for them.
  native-desktop-linux:
    name: Native desktop · Linux (WebKitGTK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Ubuntu browser test dependencies
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Run the native-display suite
        shell: bash
        run: ./.github/scripts/run-dotnet-gui-tests.sh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Native desktop · Linux
          path: "**/test-results.trx,**/e2e-results.trx"
          reporter: dotnet-trx

      - name: Locate AgentUp.Tests coverage reports
        id: coverage-reports
        if: ${{ !cancelled() }}
        shell: bash
        run: ./.github/scripts/locate-coverage-reports.sh AgentUp.Tests

      - name: Upload AgentUp.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_tests }}
          flags: agentup-tests
          name: AgentUp.Tests
          fail_ci_if_error: true
          disable_search: true

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: native-linux
          status: ${{ job.status }}

  native-desktop:
    name: Native desktop · ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    needs: payloads
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: native-macos-arm64
            title: macOS arm64 (WKWebView)
            os: macos-latest
            rid: osx-arm64
          - leg: native-macos-x64
            title: macOS x64 (WKWebView)
            os: macos-15-intel
            rid: osx-x64
          - leg: native-windows
            title: Windows (WebView2)
            os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7

      # The runner is published framework-dependent, so it needs the shared framework it targets.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: native-e2e-${{ matrix.rid }}
          path: native-e2e

      - name: Delete consumed native E2E artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="native-e2e-${{ matrix.rid }}"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" 2>/dev/null | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          fi

      - name: Run the native-display suite
        if: ${{ runner.os == 'macOS' }}
        # The suite takes seconds. A fixture that blocks the Avalonia UI thread waits on it
        # forever, so cap the step rather than let a hang hold the runner for the job default.
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x "native-e2e/agent-up-tests/AgentUp.Tests"
          mkdir -p artifacts/platform-tests
          ./native-e2e/agent-up-tests/AgentUp.Tests \
            --workers=0 \
            --where="cat == E2E" \
            --result="artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.xml;format=nunit3" \
            2>&1 | tee "artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.log"

      - name: Run the native-display suite
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/platform-tests | Out-Null
          & "native-e2e/agent-up-tests/AgentUp.Tests.exe" `
              --workers=0 `
              "--where=cat == E2E" `
              "--result=artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.xml;format=nunit3" `
              2>&1 | Tee-Object "artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.log"
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && hashFiles('artifacts/platform-tests/*.xml') != '' }}
        with:
          name: Native desktop · ${{ matrix.title }}
          path: artifacts/platform-tests/*.xml
          reporter: dotnet-nunit

      - name: Upload native-display diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: native-desktop-${{ matrix.rid }}
          path: artifacts/platform-tests
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: frontend
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Installer: each native package where it ships ────────────────────────────────────────────

  # Waits for the payloads it packages and nothing else. Source suites and coverage gate the
  # release, not the packages, so a test failure never hides an installer failure.
  installer:
    name: Installer · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [payloads, version]
    permissions:
      contents: read
      actions: write
      checks: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu .deb
            leg: ubuntu
            os: ubuntu-latest
            platform: ubuntu
            rid: linux-x64
            use-nix: false
          - name: NixOS flake
            leg: nixos
            os: ubuntu-latest
            platform: nixos
            rid: linux-x64
            use-nix: true
          - name: macOS arm64 .pkg
            leg: macos-arm64
            os: macos-latest
            platform: macos
            rid: osx-arm64
            use-nix: false
          - name: macOS x64 .pkg
            leg: macos-x64
            os: macos-15-intel
            platform: macos
            rid: osx-x64
            use-nix: false
          - name: Windows installer
            leg: windows
            os: windows-latest
            platform: windows
            rid: win-x64
            use-nix: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v23
        if: ${{ matrix.use-nix }}

      - uses: actions/download-artifact@v8
        with:
          name: dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}
          path: dotnet-ci

      - name: Delete consumed .NET CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" 2>/dev/null | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          fi

      - name: Mark downloaded tools executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging" || true
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/desktop/AgentUp.Desktop" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/server/AgentUp.Server" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/cli/AgentUp.CLI" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/tray/AgentUp.Tray" || true
          fi

      - name: Sign macOS payload binaries
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-macos-payload.sh "${{ matrix.rid }}" "dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign Windows payload binaries
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: dotnet-ci/payloads/win-x64
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows payload signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target payload -Dir dotnet-ci/payloads/win-x64

      - name: Package release artifact
        shell: bash
        env:
          SENTRY_DSN_SERVER: ${{ secrets.SENTRY_DSN_SERVER }}
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGING_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging$tool_suffix"
          ./scripts/package-release.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "${{ needs.version.outputs.version }}" "release-artifacts" \
            --payload-root "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign and notarize macOS package
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-notarize-macos.sh "${{ matrix.rid }}" "release-artifacts"

      - name: Sign Windows package artifacts
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: release-artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows package signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target package -Dir release-artifacts

      - name: Sign Linux package
        if: ${{ matrix.platform == 'ubuntu' && (vars.LINUX_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-linux.sh "release-artifacts"

      - name: Smoke test packaged artifact
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-package.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - name: Smoke test guided installer flow
        if: ${{ matrix.platform != 'nixos' }}
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp$tool_suffix"
          export AGENTUP_INSTALLER_FAKE=1
          ./.github/scripts/smoke-installer-flow.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer app startup
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-startup.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer elevation
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-elevation.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Allow installed-service smoke environment through sudo
        if: ${{ matrix.platform == 'ubuntu' }}
        shell: bash
        run: |
          echo 'Defaults env_keep += "AGENTUP_PACKAGE_SMOKE_AUTH_DISABLED"' | sudo tee /etc/sudoers.d/agentup-smoke-env
          sudo chmod 0440 /etc/sudoers.d/agentup-smoke-env

      - name: Smoke test installed service
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          # This step validates a native package and the service it installs. The runners
          # that reach it (Ubuntu and Windows; macOS and NixOS are skipped in the smoke
          # itself) provision no capabilities: no Nix and no enabled set seeded into the
          # installed service's data directory. The dotnet and docker capabilities are built
          # into the Server but deliver their toolchains through Nix, so a launch needs both,
          # and launching one here fails on provisioning the package does not own and asserts
          # nothing about the package. Real capability launches are proven by the Runtime
          # capabilities integration leg, which installs Nix and enables them.
          export AGENTUP_CAPABILITY_SMOKE_SKIP_REAL=1
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-installed-service.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.rid }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: installer
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Verdict and release ──────────────────────────────────────────────────────────────────────

  # The run's answer. Renders .github/behavior-matrix.json with every leg's verdict as the run
  # summary - which cells are proven, which failed, which did not run, and which are known gaps -
  # and fails unless every declared leg ran and passed. Require this check on pull requests.
  behavior-matrix:
    name: Behavior matrix
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - payloads
      - container
      - helm-chart
      - au-check
      - jetbrains-plugin
      - docs
      - source-dotnet
      - source-coverage
      - source-typescript
      - source-budgets
      - source-performance
      - backend
      - integration
      - journeys
      - showcase
      - sign-in-web
      - sign-in-android
      - sign-in-ios
      - native-desktop-linux
      - native-desktop
      - installer
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: verdict-*
          path: verdicts

      - name: Render the behavior matrix and decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"
          node .github/scripts/behavior-matrix.mjs render \
            --matrix .github/behavior-matrix.json \
            --verdicts verdicts \
            --needs "$RUNNER_TEMP/needs.json" \
            --summary "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [behavior-matrix, version]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true' }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install release tooling
        run: npm install

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: mikefarah/yq@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: release-artifacts

      - uses: actions/download-artifact@v8
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: release-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: au-check
          path: release-artifacts

      - name: Delete consumed package and SBOM artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select((.name | startswith("package-")) or .name == "sbom" or .name == "jetbrains-plugin" or .name == "au-check") | .id' |
            while IFS= read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
              fi
            done

      - name: Prepare release artifacts
        env:
          INCLUDE_JETBRAINS_PLUGIN: ${{ needs.version.outputs.plugin_changed }}
        run: ./.github/scripts/upload-release-artifacts.sh "${{ needs.version.outputs.version }}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish browser audit client to npm
        working-directory: AgentUp.WebAudit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Skipping npm publish because NPM_TOKEN is not configured."
            exit 0
          fi

          npm ci
          npm test
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

          if npm view "@agent-up/audit@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@agent-up/audit@$RELEASE_VERSION is already published; skipping."
            exit 0
          fi

          npm publish --access public

      - name: Publish JetBrains plugin to Marketplace
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Skipping JetBrains Marketplace publish because JETBRAINS_MARKETPLACE_TOKEN is not configured."
            exit 0
          fi

          ./gradlew --no-daemon publishPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"
