name: Agent-Up CI

# One workflow, one question per job. Jobs are named "<Stage> · <what it proves>" and every one of
# them is a leg of .github/behavior-matrix.json:
#
#   Plan         the release version
#   Build        every artifact that ships, produced once
#   Source       the code's own suites, coverage, budgets and performance - gates release only
#   Backend      the real Server and both Demo backends answer the same client contract
#   Integration  the Server against each real external dependency, one leg per dependency
#   Frontend     each client, in each shell, against each backend and on each native display
#   Installer    each native package installs, runs and uninstalls where it ships
#
# Each leg records a verdict as its last step. The Behavior matrix job renders the matrix with
# those verdicts on the run summary and fails when a leg failed or never ran, so a green run means
# every declared leg ran and passed. It is the one check to require on pull requests, and the only
# job Release waits for. Nothing waits for Source except Release: a red suite or coverage miss never
# hides what the behavior legs would have shown.
#
# Definition: docs/developer-guide/repo/ci.md. The native mobile store pipeline stays in
# mobile-ci.yaml, which this workflow does not drive.

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - android-v*
      - ios-v*
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Runs on main share one group and never cancel, so every commit that can release is built.
# Everywhere else the newest push wins: a branch run that a later push has already superseded
# only holds runners that the push it belongs to is waiting for.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main'
      && format('{0}-main-release', github.workflow)
      || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Plan ─────────────────────────────────────────────────────────────────────────────────────

  version:
    name: Plan · release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plugin_changed: ${{ steps.plugin-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install release tooling
        run: npm install

      - name: Plan version
        id: plan
        run: node .github/scripts/plan-version.js

      - name: Detect plugin changes
        id: plugin-changes
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- Plugins/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build ────────────────────────────────────────────────────────────────────────────────────

  payloads:
    name: Build · release payloads
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX agent-up.sln --json --out artifacts/sbom --set-version "${{ needs.version.outputs.version }}"
          mv artifacts/sbom/bom.json artifacts/sbom/agent-up-sbom.cdx.json

      - name: Publish .NET CI artifacts
        shell: bash
        env:
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_DSN_CLI: ${{ secrets.SENTRY_DSN_CLI }}
        run: |
          ./.github/scripts/publish-dotnet-ci-artifacts.sh "${{ needs.version.outputs.version }}" "artifacts/dotnet-ci"

      # Installer legs take packaging tools and payloads; native desktop legs take only the
      # framework-dependent E2E runner. Splitting them lets each consumer delete what it used.
      - name: Prepare per-consumer .NET CI artifacts
        shell: bash
        run: |
          rm -rf artifacts/ci-transfer
          for entry in \
            ubuntu-linux-x64:linux-x64 \
            nixos-linux-x64:linux-x64 \
            macos-osx-arm64:osx-arm64 \
            macos-osx-x64:osx-x64 \
            windows-win-x64:win-x64
          do
            platform_rid="${entry%%:*}"
            rid="${entry##*:}"
            target="artifacts/ci-transfer/$platform_rid/dotnet-ci"
            mkdir -p "$target/tools/$rid" "$target/payloads"
            cp -a "artifacts/dotnet-ci/tools/$rid/packaging" "$target/tools/$rid/"
            cp -a "artifacts/dotnet-ci/tools/$rid/package-smoke" "$target/tools/$rid/"
            cp -a "artifacts/dotnet-ci/payloads/$rid" "$target/payloads/"
          done
          for rid in osx-arm64 osx-x64 win-x64; do
            mkdir -p "artifacts/ci-transfer/native-e2e-$rid"
            cp -a "artifacts/dotnet-ci/tools/$rid/agent-up-tests" "artifacts/ci-transfer/native-e2e-$rid/"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-ubuntu-linux-x64
          path: artifacts/ci-transfer/ubuntu-linux-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-nixos-linux-x64
          path: artifacts/ci-transfer/nixos-linux-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-macos-osx-arm64
          path: artifacts/ci-transfer/macos-osx-arm64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-macos-osx-x64
          path: artifacts/ci-transfer/macos-osx-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-windows-win-x64
          path: artifacts/ci-transfer/windows-win-x64/dotnet-ci
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: native-e2e-osx-arm64
          path: artifacts/ci-transfer/native-e2e-osx-arm64
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: native-e2e-osx-x64
          path: artifacts/ci-transfer/native-e2e-osx-x64
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: native-e2e-win-x64
          path: artifacts/ci-transfer/native-e2e-win-x64
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom/agent-up-sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: payloads
          status: ${{ job.status }}

  # The image used to be built for the first time inside Release, so a broken Dockerfile surfaced
  # after the tag was planned. Building and checking it on every run moves that failure to the PR.
  container:
    name: Build · Server container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build and check the Server image
        env:
          AGENTUP_CONTAINER_VERIFY_ONLY: "1"
        run: ./.github/scripts/verify-container.sh AgentUp.Server agent-up-server

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: container
          status: ${{ job.status }}

  helm-chart:
    name: Build · Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: mikefarah/yq@v4

      - name: Lint and package chart
        run: ./.github/scripts/verify-chart.sh

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: helm-chart
          status: ${{ job.status }}

  au-check:
    name: Build · au-check binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish au-check
        run: ./.github/scripts/publish-au-check.sh artifacts/au-check

      - name: Compare the published plan with agent-up verify plan
        run: ./.github/scripts/smoke-au-check.sh artifacts/au-check/au-check-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: au-check
          path: |
            artifacts/au-check/au-check-linux-x64
            artifacts/au-check/au-check-linux-arm64
            artifacts/au-check/au-check-osx-arm64
            artifacts/au-check/au-check-osx-x64
            artifacts/au-check/au-check-win-x64.exe
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: au-check
          status: ${{ job.status }}

  jetbrains-plugin:
    name: Build · JetBrains plugin
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JetBrains plugin
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        run: |
          ./gradlew --no-daemon test buildPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"
          mkdir -p ../../artifacts/jetbrains-plugin
          cp "build/distributions/agent-up-jetbrains-${{ needs.version.outputs.version }}.zip" \
            "../../artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip"

      - uses: actions/upload-artifact@v7
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: jetbrains-plugin
          status: ${{ job.status }}

  # Runs on every event, not only main: the build regenerates the API reference from the Server
  # controllers with --check, so a route change without its reference fails the PR that made it.
  docs:
    name: Build · docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Test and build docs
        run: |
          npm --prefix docs ci
          npm --prefix docs test
          npm --prefix docs run build

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: docs
          status: ${{ job.status }}

  # ── Source: gates release only ───────────────────────────────────────────────────────────────

  # Every .NET suite runs once, with coverage. Coverage is judged by the next job from the reports
  # this one uploads, so a coverage miss and a failing test read as two different red checks.
  source-dotnet:
    name: Source · .NET suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install hosted desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 xvfb x11-apps libxtst6

      - name: Run every suite with coverage
        shell: bash
        run: ./.github/scripts/run-dotnet-tests.sh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET suites
          path: "artifacts/test-results/**/test-results.trx"
          reporter: dotnet-trx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: source-dotnet-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 3

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: dotnet
          status: ${{ job.status }}

  source-coverage:
    name: Source · patch and slice coverage
    runs-on: ubuntu-latest
    needs: source-dotnet
    # Judged even when a suite failed: the reports the other suites wrote still say what this
    # change covered, and the test failure is already red on its own check.
    if: ${{ !cancelled() }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: source-dotnet-results
          path: artifacts/test-results

      - name: Locate module coverage reports
        id: coverage-reports
        shell: bash
        run: |
          ./.github/scripts/locate-coverage-reports.sh \
            AgentUp.Architecture.Tests \
            AgentUp.CLI.Tests \
            AgentUp.Capabilities.Abstractions.Tests \
            AgentUp.Sdk.Common.Tests \
            AgentUp.Sdk.Runtime.Tests \
            AgentUp.Sdk.Agent.Tests \
            AgentUp.Sdk.Forge.Tests \
            AgentUp.Capabilities.Common.Tests \
            AgentUp.Capabilities.Claude.Tests \
            AgentUp.Capabilities.Codex.Tests \
            AgentUp.Capabilities.Cursor.Tests \
            AgentUp.Capabilities.Github.Tests \
            AgentUp.Capabilities.Forgejo.Tests \
            AgentUp.Capabilities.Docker.Tests \
            AgentUp.Capabilities.Dotnet.Tests \
            AgentUp.Capabilities.Opencode.Tests \
            AgentUp.Browser.Streaming.Tests \
            AgentUp.CommitPolicy.Tests \
            AgentUp.Desktop.Tests \
            AgentUp.AUDebug.Tests \
            AgentUp.InstallerConfig.Tests \
            AgentUp.Server.Tests \
            AgentUp.TestAgents.Tests \
            AgentUp.Tray.Tests \
            AgentUp.Verification.Tests

      - name: Enforce patch coverage
        shell: bash
        run: |
          # The coverage gate searches its report directory recursively, so making the whole
          # tree of downloaded reports visible there is enough; it then measures only the lines
          # this change touched, against the minimum in agent-up.json.
          mkdir -p artifacts/coverage
          cp -r artifacts/test-results/. artifacts/coverage/

          dotnet build AgentUp.CLI/AgentUp.CLI.csproj --configuration Release
          dotnet run --project AgentUp.CLI --configuration Release --no-build --no-launch-profile -- verify coverage

      - name: Enforce per-slice coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # This only holds where every suite has run, which is why the check is ciOnly: on a dev
          # machine the architecture suite instruments every assembly with no hits, so a slice
          # whose own suite was not selected would read as uncovered.
          dotnet run --project AgentUp.CLI --configuration Release --no-build --no-launch-profile -- verify slices

      - name: Upload AgentUp.Architecture.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_architecture_tests }}
          flags: agentup-architecture-tests
          name: AgentUp.Architecture.Tests
          fail_ci_if_error: true
          disable_search: true
          verbose: true

      - name: Upload AgentUp.CLI.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_cli_tests }}
          flags: agentup-cli-tests
          name: AgentUp.CLI.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Abstractions.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_abstractions_tests }}
          flags: agentup-capabilities-abstractions-tests
          name: AgentUp.Capabilities.Abstractions.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Sdk.Common.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_sdk_common_tests }}
          flags: agentup-sdk-common-tests
          name: AgentUp.Sdk.Common.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Sdk.Runtime.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_sdk_runtime_tests }}
          flags: agentup-sdk-runtime-tests
          name: AgentUp.Sdk.Runtime.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Sdk.Agent.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_sdk_agent_tests }}
          flags: agentup-sdk-agent-tests
          name: AgentUp.Sdk.Agent.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Sdk.Forge.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_sdk_forge_tests }}
          flags: agentup-sdk-forge-tests
          name: AgentUp.Sdk.Forge.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Common.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_common_tests }}
          flags: agentup-capabilities-common-tests
          name: AgentUp.Capabilities.Common.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Claude.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_claude_tests }}
          flags: agentup-capabilities-claude-tests
          name: AgentUp.Capabilities.Claude.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Codex.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_codex_tests }}
          flags: agentup-capabilities-codex-tests
          name: AgentUp.Capabilities.Codex.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Cursor.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_cursor_tests }}
          flags: agentup-capabilities-cursor-tests
          name: AgentUp.Capabilities.Cursor.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Github.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_github_tests }}
          flags: agentup-capabilities-github-tests
          name: AgentUp.Capabilities.Github.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Forgejo.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_forgejo_tests }}
          flags: agentup-capabilities-forgejo-tests
          name: AgentUp.Capabilities.Forgejo.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Docker.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_docker_tests }}
          flags: agentup-capabilities-docker-tests
          name: AgentUp.Capabilities.Docker.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.Capabilities.Dotnet.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_capabilities_dotnet_tests }}
          flags: agentup-capabilities-dotnet-tests
          name: AgentUp.Capabilities.Dotnet.Tests
          fail_ci_if_error: true
          disable_search: true

      - name: Upload AgentUp.CommitPolicy.Tests coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_commit_policy_tests }}
          flags: agentup-commit-policy-tests
