name: Agent-Up CI

# One workflow, one job per domain. Each job is a matrix whose entries are the legs of
# .github/behavior-matrix.json, so the run graph reads as the domains and their legs:
#
#   Plan            the release version, and which Mobile release legs a dispatch ships
#   Build           the artifacts the desktop release ships, produced once
#   Source          the code's own suites, coverage, budgets and performance - gates release only
#   Backend         the Server's client contract, held against both Demos, and the Server against
#                   each real external dependency, one leg per dependency
#   Desktop         the Desktop client against a real Server, on its Demo, and on each native display
#   Mobile          the Mobile client and its chat module against a real Server, its Demo, the
#                   identity front door and each native platform, and its signed store binaries
#   Docs            the docs site and the design-system catalog it publishes
#   Installer       each native package installs, runs and uninstalls where it ships
#
# Only Build and Installer wait for anything: Build for the version it stamps, Installer for the
# payloads it packages. Each leg records a verdict as its last step. The Behavior matrix job
# renders the matrix with those verdicts on the run summary and fails when a leg failed or never
# ran, so a green run means every declared leg ran and passed or was skipped for its declared
# reason. It is the one check to require on pull requests. Release and Mobile release wait for it
# and nothing else; Release runs on a push to main, Mobile release on a dispatch that names a
# mobile channel, never both. Nothing waits for Source except them: a red suite or coverage miss
# never hides what the behavior legs would have shown.
#
# Definition: docs/developer-guide/repo/ci.md.

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - android-v*
      - ios-v*
  pull_request:
    branches:
      - '**'
  # A dispatch runs the whole matrix. With a mobile channel it then ships the Mobile store
  # binaries that run built; it never runs Release, which belongs to pushes to main.
  workflow_dispatch:
    inputs:
      mobile-channel:
        description: Mobile store channel to ship to after the matrix passes
        type: choice
        required: true
        default: none
        options:
          - none
          - beta
          - prod
      mobile-platforms:
        description: Mobile platforms to ship
        type: choice
        required: true
        default: both
        options:
          - both
          - android
          - ios

# Runs on main share one group and never cancel, so every commit that can release is built.
# A dispatch never cancels and is never cancelled: a second one on the same ref waits, so a store
# upload is never cut off. Everywhere else the newest push wins: a branch run that a later push
# has already superseded only holds runners that the push it belongs to is waiting for.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
      && format('{0}-main-release', github.workflow)
      || format('{0}-{1}-{2}', github.workflow, github.event_name == 'workflow_dispatch' && 'dispatch' || 'run', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # ── Plan ─────────────────────────────────────────────────────────────────────────────────────

  version:
    name: Plan · release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plugin_changed: ${{ steps.plugin-changes.outputs.changed }}
      mobile_release_matrix: ${{ steps.mobile.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install release tooling
        run: npm install

      - name: Plan version
        id: plan
        run: node .github/scripts/plan-version.js

      - name: Detect plugin changes
        id: plugin-changes
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- Plugins/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The legs of Mobile release: the platforms a dispatch ships, both on any other run.
      - name: Plan the Mobile release legs
        id: mobile
        env:
          MOBILE_PLATFORMS: ${{ inputs.mobile-platforms }}
        run: |
          android='{"platform":"android"}'
          ios='{"platform":"ios"}'
          case "$MOBILE_PLATFORMS" in
            android) legs="$android" ;;
            ios) legs="$ios" ;;
            *) legs="$android,$ios" ;;
          esac
          echo "matrix={\"include\":[$legs]}" >> "$GITHUB_OUTPUT"

  # ── Build: every artifact that ships, produced once ──────────────────────────────────────────

  build:
    name: Build · ${{ matrix.title }}
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: payloads
            title: release payloads
            dotnet: true
            timeout: 45
          # The image used to be built for the first time inside Release, so a broken Dockerfile
          # surfaced after the tag was planned. Building and checking it here moves that to the PR.
          - leg: container
            title: Server container
            timeout: 45
          - leg: helm-chart
            title: Helm chart
            timeout: 15
          - leg: au-check
            title: au-check binaries
            dotnet: true
            timeout: 30
          - leg: jetbrains-plugin
            title: JetBrains plugin
            timeout: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.dotnet }}
        with:
          dotnet-version: "10.0.x"

      - name: Publish release payloads
        if: ${{ matrix.leg == 'payloads' }}
        uses: ./.github/actions/build-payloads
        with:
          version: ${{ needs.version.outputs.version }}
          sentry-dsn-desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry-dsn-cli: ${{ secrets.SENTRY_DSN_CLI }}

      - name: Build and check the Server image
        if: ${{ matrix.leg == 'container' }}
        env:
          AGENTUP_CONTAINER_VERIFY_ONLY: "1"
        run: ./.github/scripts/verify-container.sh AgentUp.Server agent-up-server

      - uses: azure/setup-helm@v5
        if: ${{ matrix.leg == 'helm-chart' }}
        with:
          version: latest

      - uses: mikefarah/yq@v4
        if: ${{ matrix.leg == 'helm-chart' }}

      - name: Lint and package chart
        if: ${{ matrix.leg == 'helm-chart' }}
        run: ./.github/scripts/verify-chart.sh

      - name: Publish au-check and compare its plan with agent-up verify plan
        if: ${{ matrix.leg == 'au-check' }}
        run: |
          ./.github/scripts/publish-au-check.sh artifacts/au-check
          ./.github/scripts/smoke-au-check.sh artifacts/au-check/au-check-linux-x64

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.leg == 'au-check' }}
        with:
          name: au-check
          path: |
            artifacts/au-check/au-check-linux-x64
            artifacts/au-check/au-check-linux-arm64
            artifacts/au-check/au-check-osx-arm64
            artifacts/au-check/au-check-osx-x64
            artifacts/au-check/au-check-win-x64.exe
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-java@v6
        if: ${{ matrix.leg == 'jetbrains-plugin' && needs.version.outputs.plugin_changed == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JetBrains plugin
        if: ${{ matrix.leg == 'jetbrains-plugin' && needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        run: |
          ./gradlew --no-daemon test buildPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"
          mkdir -p ../../artifacts/jetbrains-plugin
          cp "build/distributions/agent-up-jetbrains-${{ needs.version.outputs.version }}.zip" \
            "../../artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip"

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.leg == 'jetbrains-plugin' && needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: artifacts/jetbrains-plugin/agent-up-jetbrains-plugin.zip
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: build
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Source: the code's own suites; gates release only ────────────────────────────────────────

  # No other job waits for this one. A failing suite or a coverage miss fails the release, and
  # never hides what a behavior leg would have shown.
  source:
    name: Source · ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: dotnet
            title: .NET suites and coverage
            dotnet: true
            timeout: 60
          - leg: typescript
            title: TypeScript suites
            node: true
            timeout: 30
          - leg: budgets
            title: test-tier budgets
            dotnet: true
            timeout: 30
          - leg: performance
            title: performance gates
            dotnet: true
            node: true
            timeout: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The coverage gate diffs against the base, and plan-mobile-version.test.js reads tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.dotnet }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        if: ${{ matrix.node }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentUp.Mobile/package-lock.json

      # Every .NET suite runs once, with coverage, and the same leg then judges that coverage.
      - name: Install hosted desktop test dependencies
        if: ${{ matrix.leg == 'dotnet' }}
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 xvfb x11-apps libxtst6

      - name: Run every .NET suite with coverage
        if: ${{ matrix.leg == 'dotnet' }}
        run: ./.github/scripts/run-dotnet-tests.sh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.leg == 'dotnet' }}
        with:
          name: Source · .NET suites
          path: "artifacts/test-results/**/test-results.trx"
          reporter: dotnet-trx

      - name: Judge patch and slice coverage
        if: ${{ !cancelled() && matrix.leg == 'dotnet' }}
        uses: ./.github/actions/source-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run the TypeScript suites
        if: ${{ matrix.leg == 'typescript' }}
        run: ./.github/scripts/run-typescript-suites.sh

      - name: Install GUI watchdog dependencies
        if: ${{ matrix.leg == 'budgets' }}
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Build Release test payloads
        if: ${{ matrix.leg == 'budgets' || matrix.leg == 'performance' }}
        run: |
          dotnet restore agent-up.sln
          dotnet build agent-up.sln --configuration Release --no-restore

      - name: Enforce test-kind wall-clock budgets
        if: ${{ matrix.leg == 'budgets' }}
        run: ./.github/scripts/run-test-kind-watchdog.sh

      - name: Run .NET performance regression gates
        if: ${{ matrix.leg == 'performance' }}
        run: |
          ./scripts/run-benchmark-gate.sh browser
          ./scripts/run-benchmark-gate.sh server

      - name: Run Mobile performance regression gate
        if: ${{ matrix.leg == 'performance' }}
        working-directory: AgentUp.Mobile
        run: |
          npm ci --ignore-scripts
          npx tsx src/features/agents/benchmark/MobilePerformanceGate.ts

      # The whole tree, not only TRX files: a hung suite leaves its blame sequence and hang
      # dump beside the results, and those are what name the test that hung.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.leg == 'dotnet' }}
        with:
          name: source-dotnet-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.leg == 'budgets' }}
        with:
          name: source-budgets-results
          path: artifacts/test-kind-watchdog/*.trx
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: source
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Backend: one contract, and every real dependency ─────────────────────────────────────────

  # The contract legs hold the real Server and both Demo backends to AgentUp.FakeServer/parity.json,
  # which classifies every operation in the API reference. The dependency legs run the Server
  # against one real external dependency each, so a red leg names what broke.
  backend:
    name: Backend · ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: contract-server
            title: Contract · Server
            run: ./.github/scripts/run-backend-parity.sh server
            timeout: 30
          - leg: contract-demo-desktop
            title: Contract · Demo (Desktop)
            run: ./.github/scripts/run-backend-parity.sh demo-desktop
            timeout: 30
          - leg: contract-demo-mobile
            title: Contract · Demo (Mobile)
            run: ./.github/scripts/run-backend-parity.sh demo-mobile
            timeout: 30
          - leg: forgejo
            title: Forgejo host
            run: ./.github/scripts/run-forgejo-e2e.sh
            results: forgejo-e2e
            timeout: 20
          - leg: team-forgejo
            title: Agent team on Forgejo
            run: ./.github/scripts/run-agent-e2e.sh TeamForgejoE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: agent-sandbox
            title: Agent sandbox
            run: ./.github/scripts/run-agent-e2e.sh AgentSandboxE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: agent-mcp
            title: Agent over MCP
            run: ./.github/scripts/run-agent-e2e.sh AgentMcpE2E
            results: agent-e2e
            nix: true
            timeout: 30
          - leg: cpu-inference
            title: Loop on CPU inference
            run: ./.github/scripts/run-loop-inference.sh
            results: loop-inference
            model: true
            timeout: 60
          - leg: opencode
            title: OpenCode on CPU inference
            run: ./.github/scripts/run-opencode-inference.sh
            results: opencode-inference
            model: true
            nix: true
            timeout: 60
          - leg: runtime-capabilities
            title: Runtime capabilities
            run: ./.github/scripts/run-runtime-capability-e2e.sh
            results: runtime-capability-e2e
            nix: true
            display: true
            timeout: 40
          - leg: loop-soak
            title: Loop soak
            run: ./.github/scripts/run-loop-soak.sh
            results: loop-soak
            timeout: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The runtime-capability workspace runs `npm install` for Docs before it can serve. Example
      # Web installs with --package-lock=false and shares the same warmed ~/.npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ matrix.display && 'npm' || '' }}
          cache-dependency-path: docs/package-lock.json

      # Pinned GGUF shared by the CPU-inference and OpenCode legs; the model server and the loop
      # both SHA-check what they load from it.
      - uses: actions/cache@v6
        if: ${{ matrix.model }}
        with:
          path: ~/.cache/agent-up/models
          key: loop-inference-gguf-${{ hashFiles('AgentUp.TestAgents/Features/Inference/Models/GgufModelSpec.cs') }}

      # Capabilities deliver toolchains through Nix and the Server confines agents with Nix's
      # bubblewrap, so these legs need Nix the way a real Server host does.
      - uses: DeterminateSystems/nix-installer-action@v23
        if: ${{ matrix.nix }}

      - name: Install Ubuntu browser test dependencies
        if: ${{ matrix.display }}
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Run ${{ matrix.title }}
        run: ${{ matrix.run }}

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.results && hashFiles(format('artifacts/test-results/{0}/*.trx', matrix.results)) != '' }}
        with:
          name: Backend · ${{ matrix.title }}
          path: artifacts/test-results/${{ matrix.results }}/*.trx
          reporter: dotnet-trx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.results }}
        with:
          name: backend-${{ matrix.leg }}-results
          path: artifacts/test-results/${{ matrix.results }}
          if-no-files-found: warn
          retention-days: 7

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: backend
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Desktop: the Desktop client against each backend and on each native display ──────────────

  # Journeys replay the QA flows of docs/developer-guide/verification/qa-coverage.md on an isolated
  # real Server. Showcase drives the client on its Demo through every screen the design system
  # documents. Native runs AgentUp.Tests on a real display: Linux from source, macOS and Windows
  # from a framework-dependent runner each leg publishes for its own runtime, so this domain
  # waits for nothing.
  desktop:
    name: Desktop · ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      checks: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: journeys
            title: Journeys on a real Server
            os: ubuntu-latest
            timeout: 75
          - leg: showcase
            title: Showcase on the Demo
            os: ubuntu-latest
            timeout: 40
          - leg: native-linux
            title: Native Linux (WebKitGTK)
            os: ubuntu-latest
            timeout: 60
          # macos-15, not macos-latest: iOS store and sign-in need Xcode 26 on macos-latest,
          # and GitHub cancelled this native leg when it shared that pool.
          - leg: native-macos-arm64
            title: Native macOS arm64 (WKWebView)
            os: macos-15
            rid: osx-arm64
            timeout: 30
          - leg: native-macos-x64
            title: Native macOS x64 (WKWebView)
            os: macos-15-intel
            rid: osx-x64
            timeout: 30
          - leg: native-windows
            title: Native Windows (WebView2)
            os: windows-latest
            rid: win-x64
            timeout: 30
    steps:
      - uses: actions/checkout@v7

      # The macOS and Windows runners are published framework-dependent and need the shared
      # framework; the Linux legs build from source.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        if: ${{ matrix.leg == 'journeys' || matrix.leg == 'showcase' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentUp.Mobile/package-lock.json

      - name: Install Ubuntu browser test dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      # Journeys: one flow per au-debug validate run on a fresh Server data directory.
      - name: Replay every Desktop journey
        if: ${{ matrix.leg == 'journeys' }}
        shell: bash
        run: ./.github/scripts/run-journeys.sh desktop

      # Showcase: reaching every screen gates. The comparison with the design system's copy is
      # reported, not yet gating: Desktop cannot report its own text (a declared gap).
      - name: Install window capture dependencies
        if: ${{ matrix.leg == 'showcase' }}
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 xdotool imagemagick libsm6 libice6

      - name: Capture every documented Desktop screen on the Demo
        if: ${{ matrix.leg == 'showcase' }}
        shell: bash
        run: ./.github/scripts/capture-product-screens.sh desktop

      - name: Compare the captured screens with the design system
        if: ${{ matrix.leg == 'showcase' }}
        continue-on-error: true
        shell: bash
        run: ./.github/scripts/compare-product-screens.sh desktop

      # Native Linux: native-display tests, then HeadlessE2E, from source.
      - name: Run the native-display suite from source
        if: ${{ matrix.leg == 'native-linux' }}
        shell: bash
        run: ./.github/scripts/run-dotnet-gui-tests.sh

      - name: Locate AgentUp.Tests coverage reports
        id: coverage-reports
        if: ${{ !cancelled() && matrix.leg == 'native-linux' }}
        shell: bash
        run: ./.github/scripts/locate-coverage-reports.sh AgentUp.Tests

      - name: Upload AgentUp.Tests coverage
        if: ${{ !cancelled() && matrix.leg == 'native-linux' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.agentup_tests }}
          flags: agentup-tests
          name: AgentUp.Tests
          fail_ci_if_error: true
          disable_search: true

      # Native macOS and Windows: Avalonia Native has to initialise on the process main thread,
      # so the suite runs from its NUnitLite entry point rather than under dotnet test.
      - name: Publish the native-display runner for this runtime
        if: ${{ matrix.rid }}
        shell: bash
        run: ./.github/scripts/publish-native-e2e-runner.sh ${{ matrix.rid }} native-e2e/agent-up-tests

      # The suite takes seconds. A fixture that blocks the Avalonia UI thread waits on it forever,
      # so cap the step rather than let a hang hold the runner for the job default.
      - name: Run the published native-display suite
        if: ${{ matrix.rid && runner.os == 'macOS' }}
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x "native-e2e/agent-up-tests/AgentUp.Tests"
          mkdir -p artifacts/platform-tests
          ./native-e2e/agent-up-tests/AgentUp.Tests \
            --workers=0 \
            --where="cat == E2E" \
            --result="artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.xml;format=nunit3" \
            2>&1 | tee "artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.log"

      - name: Run the published native-display suite
        if: ${{ matrix.rid && runner.os == 'Windows' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/platform-tests | Out-Null
          & "native-e2e/agent-up-tests/AgentUp.Tests.exe" `
              --workers=0 `
              "--where=cat == E2E" `
              "--result=artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.xml;format=nunit3" `
              2>&1 | Tee-Object "artifacts/platform-tests/agent-up-tests-${{ matrix.rid }}.log"
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.leg == 'native-linux' }}
        with:
          name: Desktop · ${{ matrix.title }}
          path: "**/test-results.trx,**/e2e-results.trx"
          reporter: dotnet-trx

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.rid && hashFiles('artifacts/platform-tests/*.xml') != '' }}
        with:
          name: Desktop · ${{ matrix.title }}
          path: artifacts/platform-tests/*.xml
          reporter: dotnet-nunit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-${{ matrix.leg }}
          path: |
            artifacts/desktop-validation
            artifacts/product-screens
            artifacts/platform-tests
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: desktop
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Docs: the docs site and the design-system catalog it publishes ───────────────────────────

  # The site build regenerates the API reference from the Server controllers with --check, so a
  # route change without its reference fails the change that made it, and holds every page to the
  # page standard. The catalog leg holds the design system to being the only visual source: one
  # palette, catalog-only paint, and the scenes both command centers mount.
  docs:
    name: Docs · ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: site
            title: Site and API reference
          - leg: design-system
            title: Design-system catalog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            AgentUp.DesignSystem/package-lock.json

      - name: Test and build the docs site
        if: ${{ matrix.leg == 'site' }}
        run: |
          npm --prefix docs ci
          npm --prefix docs test
          npm --prefix docs run build

      - name: Run the design-system suite
        if: ${{ matrix.leg == 'design-system' }}
        run: |
          npm --prefix AgentUp.DesignSystem ci
          npm --prefix AgentUp.DesignSystem test

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: docs
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Mobile: the Mobile client and its chat module, against each backend and native platform ──

  # Journeys and Showcase mirror Desktop's. Browser SSO signs the installable web client in through
  # the identity front door example. Sign-in drives the chat module's agent sign-in, every
  # transport, against a real Server, the test agents and the identity provider, on the PWA, a
  # real Android emulator and a real iOS simulator; each sign-in leg publishes the Server and test
  # agents itself while it provisions its emulator or toolchain, and its cache keeps an unchanged
  # client from being rebuilt. The store legs build, sign and validate the full client for Google
  # Play and the App Store on every run, so a change that breaks a store build is red where it was
  # made; Mobile release uploads exactly those binaries.
  mobile:
    name: Mobile · ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: journeys
            title: Journeys on a real Server
            os: ubuntu-latest
            timeout: 75
          - leg: showcase
            title: Showcase on the Demo
            os: ubuntu-latest
            timeout: 40
          - leg: browser-sso
            title: Browser SSO front door
            os: ubuntu-latest
            timeout: 30
          - leg: sign-in-web
            title: Sign-in on the installable web
            os: ubuntu-latest
            timeout: 60
          - leg: sign-in-android
            title: Sign-in on Android
            os: ubuntu-latest
            timeout: 120
          - leg: sign-in-ios
            title: Sign-in on iOS
            os: macos-latest
            timeout: 150
          - leg: store-android
            title: Android store bundle
            os: ubuntu-latest
            platform: android
            timeout: 120
          - leg: store-ios
            title: iOS store archive
            os: macos-latest
            platform: ios
            timeout: 150
    steps:
      - uses: actions/checkout@v7
        with:
          # A mobile release versions from the newest product tag reachable from this commit.
          fetch-depth: ${{ matrix.platform && '0' || '1' }}

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.leg == 'journeys' || matrix.leg == 'showcase' }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        if: ${{ matrix.leg == 'journeys' || matrix.leg == 'showcase' || matrix.leg == 'browser-sso' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentUp.Mobile/package-lock.json
            AgentUp.Mobile.E2E/package-lock.json
            Examples/browser-sso/package-lock.json

      - name: Replay every Mobile journey
        if: ${{ matrix.leg == 'journeys' }}
        run: ./.github/scripts/run-journeys.sh mobile

      - name: Install Ubuntu browser test dependencies
        if: ${{ matrix.leg == 'showcase' }}
        run: ./.github/scripts/install-ubuntu-browser-test-deps.sh

      - name: Capture every documented Mobile screen on the Demo
        if: ${{ matrix.leg == 'showcase' }}
        run: ./.github/scripts/capture-product-screens.sh mobile

      # Reported, not yet gating: every Mobile screen diverges from the copy the showcase
      # documents (a declared gap in .github/behavior-matrix.json).
      - name: Compare the captured screens with the design system
        if: ${{ matrix.leg == 'showcase' }}
        continue-on-error: true
        run: ./.github/scripts/compare-product-screens.sh mobile

      - name: Sign in through the browser SSO front door
        if: ${{ matrix.leg == 'browser-sso' }}
        run: ./.github/scripts/run-browser-sso.sh

      - name: Sign in on the installable web build
        if: ${{ matrix.leg == 'sign-in-web' }}
        uses: ./.github/actions/sign-in-web

      - name: Sign in on an Android emulator
        if: ${{ matrix.leg == 'sign-in-android' }}
        uses: ./.github/actions/sign-in-android

      - name: Sign in on an iOS simulator
        if: ${{ matrix.leg == 'sign-in-ios' }}
        uses: ./.github/actions/sign-in-ios

      # A store leg signs on every run except where GitHub withholds the signing secrets, and on a
      # mobile release dispatch that ships the other platform only. Those record a declared skip
      # with its reason, which the Behavior matrix shows as skipped rather than passed.
      - name: Decide whether this store leg signs
        id: store
        if: ${{ matrix.platform }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MOBILE_CHANNEL: ${{ inputs.mobile-channel }}
          MOBILE_PLATFORMS: ${{ inputs.mobile-platforms }}
          STORE_PLATFORM: ${{ matrix.platform }}
        run: node .github/scripts/mobile-store-leg.mjs

      # An ordinary run builds 0.0.0; a mobile release versions from the newest vX.Y.Z tag
      # reachable from this commit. Either way the build number is this run's number.
      - name: Plan the store version
        id: store-version
        if: ${{ steps.store.outputs.sign == 'true' }}
        run: |
          if [ "${{ steps.store.outputs.release }}" = true ]; then
            node .github/scripts/plan-mobile-version.js
          else
            {
              echo "source_tag=ci"
              echo "version=0.0.0"
              echo "version_code=${GITHUB_RUN_NUMBER}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and validate the Android store bundle
        if: ${{ steps.store.outputs.sign == 'true' && matrix.platform == 'android' }}
        uses: ./.github/actions/mobile-store-android
        with:
          version: ${{ steps.store-version.outputs.version }}
          version-code: ${{ steps.store-version.outputs.version_code }}
          source-tag: ${{ steps.store-version.outputs.source_tag }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-pass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          keyalias-name: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          keyalias-pass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          sentry-dsn: ${{ secrets.SENTRY_DSN_MOBILE }}

      - name: Build, sign and validate the iOS store archive
        if: ${{ steps.store.outputs.sign == 'true' && matrix.platform == 'ios' }}
        uses: ./.github/actions/mobile-store-ios
        with:
          version: ${{ steps.store-version.outputs.version }}
          version-code: ${{ steps.store-version.outputs.version_code }}
          source-tag: ${{ steps.store-version.outputs.source_tag }}
          appstore-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore-issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore-p8: ${{ secrets.APPSTORE_P8 }}
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-repository: ${{ secrets.MATCH_REPOSITORY }}
          match-deploy-key: ${{ secrets.MATCH_DEPLOY_KEY }}
          sentry-dsn: ${{ secrets.SENTRY_DSN_MOBILE }}

      # The sign-in and store actions upload their own diagnostics and binaries.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (matrix.leg == 'journeys' || matrix.leg == 'showcase') }}
        with:
          name: mobile-${{ matrix.leg }}
          path: |
            artifacts/mobile-validation
            artifacts/product-screens
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: mobile
          leg: ${{ matrix.leg }}
          status: ${{ steps.store.outputs.sign == 'false' && 'skipped' || job.status }}

  # ── Installer: each native package where it ships ────────────────────────────────────────────

  # Waits for the payloads Build publishes and nothing else. Source suites and coverage gate the
  # release, not the packages, so a test failure never hides an installer failure.
  installer:
    name: Installer · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [build, version]
    permissions:
      contents: read
      actions: write
      checks: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu .deb
            leg: ubuntu
            os: ubuntu-latest
            platform: ubuntu
            rid: linux-x64
            use-nix: false
          - name: NixOS flake
            leg: nixos
            os: ubuntu-latest
            platform: nixos
            rid: linux-x64
            use-nix: true
          - name: macOS arm64 .pkg
            leg: macos-arm64
            os: macos-latest
            platform: macos
            rid: osx-arm64
            use-nix: false
          - name: macOS x64 .pkg
            leg: macos-x64
            os: macos-15-intel
            platform: macos
            rid: osx-x64
            use-nix: false
          - name: Windows installer
            leg: windows
            os: windows-latest
            platform: windows
            rid: win-x64
            use-nix: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v23
        if: ${{ matrix.use-nix }}

      - uses: actions/download-artifact@v8
        with:
          name: dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}
          path: dotnet-ci

      - name: Delete consumed .NET CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="dotnet-ci-${{ matrix.platform }}-${{ matrix.rid }}"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" 2>/dev/null | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          fi

      - name: Mark downloaded tools executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging" || true
            chmod +x "dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/desktop/AgentUp.Desktop" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/server/AgentUp.Server" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/cli/AgentUp.CLI" || true
            chmod +x "dotnet-ci/payloads/${{ matrix.rid }}/tray/AgentUp.Tray" || true
          fi

      - name: Sign macOS payload binaries
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-macos-payload.sh "${{ matrix.rid }}" "dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign Windows payload binaries
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: dotnet-ci/payloads/win-x64
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows payload signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target payload -Dir dotnet-ci/payloads/win-x64

      - name: Package release artifact
        shell: bash
        env:
          SENTRY_DSN_SERVER: ${{ secrets.SENTRY_DSN_SERVER }}
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGING_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/packaging/AgentUp.Packaging$tool_suffix"
          ./scripts/package-release.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "${{ needs.version.outputs.version }}" "release-artifacts" \
            --payload-root "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Sign and notarize macOS package
        if: ${{ matrix.platform == 'macos' && (vars.MACOS_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_SPECIFIC_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-notarize-macos.sh "${{ matrix.rid }}" "release-artifacts"

      - name: Sign Windows package artifacts
        if: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: release-artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.ams.digicert.com
          timestamp-digest: SHA256

      - name: Smoke test Windows package signing
        if: ${{ matrix.platform == 'windows' && vars.SIGNING_SMOKE_TEST == 'true' }}
        shell: pwsh
        run: |
          .github/scripts/sign-windows-smoke.ps1 -Target package -Dir release-artifacts

      - name: Sign Linux package
        if: ${{ matrix.platform == 'ubuntu' && (vars.LINUX_SIGNING_ENABLED == 'true' || vars.SIGNING_SMOKE_TEST == 'true') }}
        shell: bash
        env:
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          SIGNING_SMOKE_TEST: ${{ vars.SIGNING_SMOKE_TEST }}
        run: |
          ./.github/scripts/sign-linux.sh "release-artifacts"

      - name: Smoke test packaged artifact
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-package.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - name: Smoke test guided installer flow
        if: ${{ matrix.platform != 'nixos' }}
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp$tool_suffix"
          export AGENTUP_INSTALLER_FAKE=1
          ./.github/scripts/smoke-installer-flow.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer app startup
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-startup.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Smoke test installer elevation
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          export AGENTUP_INSTALLER_APP_COMMAND="$PWD/dotnet-ci/payloads/${{ matrix.rid }}/installer/AgentUp.InstallerApp"
          ./.github/scripts/smoke-installer-elevation.sh "${{ matrix.platform }}" "$PWD/dotnet-ci/payloads/${{ matrix.rid }}"

      - name: Allow installed-service smoke environment through sudo
        if: ${{ matrix.platform == 'ubuntu' }}
        shell: bash
        run: |
          echo 'Defaults env_keep += "AGENTUP_PACKAGE_SMOKE_AUTH_DISABLED"' | sudo tee /etc/sudoers.d/agentup-smoke-env
          sudo chmod 0440 /etc/sudoers.d/agentup-smoke-env

      - name: Smoke test installed service
        shell: bash
        run: |
          tool_suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            tool_suffix=".exe"
          fi
          # This step validates a native package and the service it installs. The runners
          # that reach it (Ubuntu and Windows; macOS and NixOS are skipped in the smoke
          # itself) provision no capabilities: no Nix and no enabled set seeded into the
          # installed service's data directory. The dotnet and docker capabilities are built
          # into the Server but deliver their toolchains through Nix, so a launch needs both,
          # and launching one here fails on provisioning the package does not own and asserts
          # nothing about the package. Real capability launches are proven by the Runtime
          # capabilities integration leg, which installs Nix and enables them.
          export AGENTUP_CAPABILITY_SMOKE_SKIP_REAL=1
          export AGENTUP_PACKAGE_SMOKE_COMMAND="$PWD/dotnet-ci/tools/${{ matrix.rid }}/package-smoke/AgentUp.PackageSmoke$tool_suffix"
          ./.github/scripts/smoke-installed-service.sh "${{ matrix.platform }}" "${{ matrix.rid }}" "release-artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.rid }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/record-verdict
        if: ${{ always() }}
        with:
          stage: installer
          leg: ${{ matrix.leg }}
          status: ${{ job.status }}

  # ── Verdict and release ──────────────────────────────────────────────────────────────────────

  # The run's answer. Renders .github/behavior-matrix.json with every leg's verdict as the run
  # summary - which cells are proven, which failed, which did not run, and which are known gaps -
  # and fails unless every declared leg ran and passed. Require this check on pull requests.
  behavior-matrix:
    name: Behavior matrix
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - build
      - source
      - backend
      - desktop
      - mobile
      - docs
      - installer
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: verdict-*
          path: verdicts

      - name: Render the behavior matrix and decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"
          node .github/scripts/behavior-matrix.mjs render \
            --matrix .github/behavior-matrix.json \
            --verdicts verdicts \
            --needs "$RUNNER_TEMP/needs.json" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Release runs only on a push to main. A dispatch, with or without a mobile channel, never
  # reaches it.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [behavior-matrix, version]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true' }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install release tooling
        run: npm install

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: mikefarah/yq@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: release-artifacts

      - uses: actions/download-artifact@v8
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        with:
          name: jetbrains-plugin
          path: release-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: au-check
          path: release-artifacts

      - name: Delete consumed package and SBOM artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select((.name | startswith("package-")) or .name == "sbom" or .name == "jetbrains-plugin" or .name == "au-check") | .id' |
            while IFS= read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
              fi
            done

      - name: Prepare release artifacts
        env:
          INCLUDE_JETBRAINS_PLUGIN: ${{ needs.version.outputs.plugin_changed }}
        run: ./.github/scripts/upload-release-artifacts.sh "${{ needs.version.outputs.version }}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish browser audit client to npm
        working-directory: AgentUp.WebAudit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Skipping npm publish because NPM_TOKEN is not configured."
            exit 0
          fi

          npm ci
          npm test
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

          if npm view "@agent-up/audit@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@agent-up/audit@$RELEASE_VERSION is already published; skipping."
            exit 0
          fi

          npm publish --access public

      - name: Publish JetBrains plugin to Marketplace
        if: ${{ needs.version.outputs.plugin_changed == 'true' }}
        working-directory: Plugins/Jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Skipping JetBrains Marketplace publish because JETBRAINS_MARKETPLACE_TOKEN is not configured."
            exit 0
          fi

          ./gradlew --no-daemon publishPlugin -PagentUpVersion="${{ needs.version.outputs.version }}"

  # Mobile release sits beside Release and waits for the same two things. It runs only on a
  # dispatch that names a mobile channel, and Release only on a push to main, so one run never
  # does both. It uploads the binaries the Mobile store legs built, verified against their
  # checksums, rather than building again.
  # A static name: GitHub does not evaluate the matrix of a skipped job, and appends the
  # platform itself when the job runs, as "Mobile release (android)".
  mobile-release:
    name: Mobile release
    runs-on: ${{ matrix.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    needs: [behavior-matrix, version]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mobile-channel == 'beta' || inputs.mobile-channel == 'prod') }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.mobile_release_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ matrix.platform == 'ios' }}
        with:
          xcode-version: "26.4"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: mobile-${{ matrix.platform }}
          path: artifacts/mobile

      - name: Read what the store leg built
        id: built
        run: node .github/scripts/mobile-release-manifest.mjs read artifacts/mobile/release.json ${{ matrix.platform }} >> "$GITHUB_OUTPUT"

      - name: Verify the binary against its checksum
        run: (cd artifacts/mobile && shasum -a 256 -c "$(basename "${{ steps.built.outputs.checksumPath }}")")

      - name: Require Play upload secrets
        if: ${{ matrix.platform == 'android' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash .github/scripts/require-env.sh GOOGLE_PLAY_SERVICE_ACCOUNT_JSON

      - name: Write Play service account
        if: ${{ matrix.platform == 'android' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play.json"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/google-play.json"

      - name: Upload to Google Play
        if: ${{ matrix.platform == 'android' }}
        env:
          ANDROID_AAB_PATH: ${{ github.workspace }}/${{ steps.built.outputs.path }}
          ANDROID_PACKAGE_NAME: net.themassiveone.agentup.android
          GOOGLE_PLAY_KEY_FILE_PATH: ${{ runner.temp }}/google-play.json
        run: bundle exec fastlane android ${{ inputs.mobile-channel == 'prod' && 'release' || 'beta' }}

      - name: Upload to App Store Connect
        if: ${{ matrix.platform == 'ios' }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          IOS_IPA_PATH: ${{ github.workspace }}/${{ steps.built.outputs.path }}
        run: bundle exec fastlane ios ${{ inputs.mobile-channel == 'prod' && 'release' || 'beta' }}

      - name: Publish the ${{ matrix.platform }}-v GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-mobile-github-release.sh \
            ${{ matrix.platform }} \
            "${{ steps.built.outputs.version }}" \
            "${{ steps.built.outputs.versionCode }}" \
            "${{ inputs.mobile-channel }}" \
            "${{ steps.built.outputs.sourceTag }}" \
            "${{ steps.built.outputs.path }}" \
            "${{ steps.built.outputs.checksumPath }}"
