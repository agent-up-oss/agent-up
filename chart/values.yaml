namespace: agent-up
platform:
  apexDomain: massivecreationlab.com
  disableSsl: false
ingress:
  host: ""
  tlsSecretName: agent-up-tls
  clusterIssuer: letsencrypt-prod
imagePullSecrets: []
server:
  image:
    repository: docker.io/themassiveone/agent-up-server
    tag: ""
    pullPolicy: Always
  existingSecret: ""
  existingSentrySecret: ""
  existingSecretKeys:
    adminPassword: AGENTUP_ADMIN_PASSWORD
    sentryDsn: SENTRY_DSN
  adminPassword: ""
  storage: 40Gi
  dataDirectory: /var/lib/agent-up
  securityContext:
    fsGroup: 1654
    runAsUser: 1654
    runAsNonRoot: true
capabilities:
  enabled:
    - id: dotnet
      version: "1.0.0"
    - id: docker
      version: "1.0.0"
    - id: codex
      version: "1.0.0"
    - id: cursor
      version: "1.0.0"
    - id: claude
      version: "1.0.0"
