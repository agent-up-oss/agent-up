namespace: agent-up
platform:
  apexDomain: massivecreationlab.com
  disableSsl: false
ingress:
  host: ""
  tlsSecretName: agent-up-tls
  clusterIssuer: letsencrypt-prod
imagePullSecrets: []
server:
  image:
    repository: docker.io/themassiveone/agent-up-server
    tag: ""
    pullPolicy: Always
  existingSecret: ""
  existingSentrySecret: ""
  existingSecretKeys:
    adminPassword: AGENTUP_ADMIN_PASSWORD
    sentryDsn: SENTRY_DSN
  adminPassword: ""
  storage: 10Gi
  dataDirectory: /var/lib/agent-up
  securityContext:
    fsGroup: 1654
    runAsUser: 1654
    runAsNonRoot: true
capabilities:
  docker:
    disabled: true
    versions: []
  dotnet:
    disabled: true
    versions: []
  codex:
    disabled: false
    versions:
      - bundled
    command: /opt/agent-up/bin/codex-acp
    arguments: []
  cursor:
    disabled: false
    versions:
      - bundled
    command: /opt/agent-up/bin/agent
    arguments:
      - acp
  claude:
    disabled: false
    versions:
      - bundled
    command: /opt/agent-up/bin/claude-agent-acp
    arguments: []
