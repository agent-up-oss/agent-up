apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-up-capabilities
  namespace: {{ .Values.namespace }}
data:
  capabilities.json: |
    {{- $entries := list }}
    {{- range $id, $capability := .Values.capabilities }}
    {{- if not $capability.disabled }}
    {{- $entry := dict "id" $id "versions" ($capability.versions | default list) }}
    {{- with $capability.command }}
    {{- $_ := set $entry "command" . }}
    {{- end }}
    {{- if $capability.arguments }}
    {{- $_ := set $entry "arguments" $capability.arguments }}
    {{- end }}
    {{- if $capability.versionArguments }}
    {{- $_ := set $entry "versionArguments" $capability.versionArguments }}
    {{- end }}
    {{- $entries = append $entries $entry }}
    {{- end }}
    {{- end }}
    {{- $entries | toPrettyJson | nindent 4 }}
